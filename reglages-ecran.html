<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Tournoi CSV · Réglages Écran TV</title>
<style>

label{display:block;font-weight:760;margin:14px 0 5px}select{width:100%;background:#13070c;color:white;border:1px solid #a86647;border-radius:9px;padding:10px;font:inherit}fieldset{border:1px solid #6a3841;border-radius:11px;margin:15px 0 0;padding:7px 12px 12px}fieldset legend{font-weight:800;padding:0 6px}fieldset label{display:flex;gap:9px;align-items:center;margin:7px 0;font-weight:500}input[type=checkbox]{width:18px;height:18px;accent-color:#eeb32a}
button{cursor:pointer;background:#ffca37;border:0;border-radius:10px;padding:12px 14px;font:800 14px system-ui;color:#26070a}button.secondary{background:#3e2027;border:1px solid #976250;color:#ffebd3}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.status{padding:12px;border:1px solid #88602d;border-radius:10px;background:#211318;white-space:pre-line;min-height:65px}.status.ok{border-color:#4fbf83;color:#c4f3d4}.status.error{border-color:#e16b78;color:#ffb0ba}
.preview{min-width:0}.iframe-wrap{aspect-ratio:16 / 9;background:black;overflow:hidden;border-radius:13px;border:1px solid #7b4a32}iframe{width:100%;height:100%;border:0}ul{margin:9px 0;padding-left:22px}.checklist{font-size:13px;color:#e0ccd0}a{color:#ffc84a}footer{max-width:1500px;margin:auto;padding:0 24px 26px;color:#d4aeb9;font-size:12px}@media(max-width:900px){main{grid-template-columns:1fr}.iframe-wrap{min-height:240px}}

</head><body data-screen-mode="live">
<header><div><small>CS LA VERPILLIÈRE · 1939</small><b>Tournoi CSV · Écran TV</b></div></header>
<main>
<form class="panel" id="settings">
<h1>Réglages Écran TV</h1>
<fieldset class="selection" id="selection" disabled>
<label for="day">Journée du tournoi</label>
<select id="day"><option value="">Chargement des journées…</option></select>
<label for="categories">Catégories à l’écran</label>
<select id="categories" aria-describedby="category-help"><option value="both">Toutes les catégories</option></select>
<p id="category-help" class="caption"></p>
</fieldset>
<label for="limit">Prochains matchs par catégorie</label>
<select id="limit"><option value="1">1 match</option><option value="2">2 matchs</option><option value="3">3 matchs</option><option value="4">4 matchs</option></select>
<label for="rotation">Temps par écran</label>
<select id="rotation"><option value="5">5 secondes</option><option value="10">10 secondes</option><option value="15">15 secondes</option><option value="20">20 secondes</option><option value="30">30 secondes</option></select>
<fieldset><legend>Rubriques visibles</legend><label><input type="checkbox" name="view" value="results"> Derniers résultats</label><label><input type="checkbox" name="view" value="standings"> Classements</label><label><input type="checkbox" name="view" value="upcoming"> Prochains matchs</label><label><input type="checkbox" name="view" value="finals"> Phases finales</label><label><input type="checkbox" id="show-partners"> Partenaires</label></fieldset>
<div class="actions"><button type="submit" id="save" disabled>Enregistrer</button><button type="button" class="secondary" id="reset" disabled>Réinitialiser</button></div>
<div id="status" class="status" role="status">Chargement des journées publiées…</div>
<p class="caption">Les réglages sont enregistrés dans ce navigateur. Un lien direct vers un tournoi conserve sa propre journée et sa catégorie.</p>
</form>
<section class="panel preview">
<div class="preview-head"><h2>Aperçu de l’écran TV</h2><a class="screen-link" id="open-screen" href="./ecran.html" target="_blank" rel="noopener">Ouvrir l’écran TV</a></div>
<div class="iframe-wrap"><iframe id="preview" title="Aperçu de l’écran TV"></iframe></div>
</section>
</main></body></html>
