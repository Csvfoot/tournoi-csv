<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournoi CS La Verpillière - 1939</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM 18 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone pour JSX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <!-- Tone.js pour les signaux sonores du chronomètre -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
  <!-- Firebase SDK compatibilité web universelle -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

  <style>
    body {
      background-color: #0e0708;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const OFFICIAL_PUBLIC_URL = 'https://csvfoot.github.io/tournoi-csv/';

    const TEAM_COLORS = [
      '#DC2626', '#EAB308', '#991B1B', '#F59E0B', 
      '#B91C1C', '#FBBF24', '#7F1D1D', '#3B82F6',
      '#10B981', '#059669', '#06B6D4', '#2563EB',
      '#6366F1', '#8B5CF6', '#D946EF', '#EC4899',
      '#14B8A6', '#64748B'
    ];

    const DEFAULT_FIELDS = [
      { id: 'f1', name: 'Terrain Honneur (Pelouse)' },
      { id: 'f2', name: 'Terrain Annexe (Synthétique)' }
    ];

    const DEMO_TEAMS = [
      { id: 't1', name: 'CS La Verpillière (1)', color: '#DC2626', players: ['Enzo R.', 'Lucas M.', 'Alexandre G.', 'Sofiane B.'] },
      { id: 't2', name: 'CS La Verpillière (2)', color: '#EAB308', players: ['Hugo L.', 'Kylian V.', 'Antoine P.', 'Marc T.'] },
      { id: 't3', name: 'Olympique Nord Isère', color: '#B91C1C', players: ['Romain F.', 'Youssef H.', 'Clément M.', 'Maxime B.'] },
      { id: 't4', name: 'FC Vallée du Guiers', color: '#F59E0B', players: ['Karim Z.', 'Benoît R.', 'David S.', 'Thomas N.'] },
      { id: 't5', name: 'AS Saint-Quentin', color: '#991B1B', players: ['Gabriel K.', 'Paul E.', 'Julien D.', 'Florian C.'] },
      { id: 't6', name: 'Bourgoin Jallieu FC', color: '#FBBF24', players: ['Adrien B.', 'Loïc V.', 'Quentin R.', 'Samir A.'] },
      { id: 't7', name: 'FC L\'Isle d\'Abeau', color: '#7F1D1D', players: ['Nicolas M.', 'Mathieu J.', 'Sébastien L.', 'Dylan P.'] },
      { id: 't8', name: 'US Villefontaine', color: '#3B82F6', players: ['Valentin B.', 'Théo C.', 'Arthur G.', 'Pierre F.'] }
    ];

    // Blason Officiel CS La Verpillière
    function ClubLogo({ className = "w-11 h-11" }) {
      return (
        <svg viewBox="0 0 200 200" className={`${className} flex-shrink-0 drop-shadow-[0_4px_10px_rgba(234,179,8,0.45)]`}>
          <defs>
            <radialGradient id="cslvDarkBg" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor="#7a0a16" />
              <stop offset="70%" stopColor="#45050c" />
              <stop offset="100%" stopColor="#1a0205" />
            </radialGradient>
            <linearGradient id="cslvGoldRing" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#fff385" />
              <stop offset="25%" stopColor="#f59e0b" />
              <stop offset="50%" stopColor="#d97706" />
              <stop offset="75%" stopColor="#fde047" />
              <stop offset="100%" stopColor="#92400e" />
            </linearGradient>
            <linearGradient id="cslvShieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#800a14" />
              <stop offset="100%" stopColor="#3d0308" />

            <path id="bottomTextArc" d="M 172,100 A 72,72 0 0,1 28,100" />
          </defs>

          <circle cx="100" cy="100" r="98" fill="url(#cslvGoldRing)" />
          <circle cx="100" cy="100" r="94" fill="#1f0206" />
          <circle cx="100" cy="100" r="91" fill="url(#cslvDarkBg)" stroke="url(#cslvGoldRing)" strokeWidth="2.8" />
          <circle cx="100" cy="100" r="69" fill="none" stroke="url(#cslvGoldRing)" strokeWidth="1.8" opacity="0.8" />

          <text fill="#FFFFFF" fontSize="13.2" fontWeight="900" letterSpacing="2.8" fontFamily="sans-serif">
            <textPath href="#topTextArc" startOffset="50%" textAnchor="middle">CLUB SPORTIF</textPath>
          </text>
          <text fill="#FFFFFF" fontSize="12" fontWeight="900" letterSpacing="2.6" fontFamily="sans-serif">
            <textPath href="#bottomTextArc" startOffset="50%" textAnchor="middle">LA VERPILLIÈRE</textPath>
          </text>

          <text x="24" y="96" fill="#FDE047" fontSize="12" fontWeight="900" textAnchor="middle">19</text>
          <circle cx="24" cy="111" r="7" fill="#800a14" stroke="url(#cslvGoldRing)" strokeWidth="1.5" />
          <text x="176" y="96" fill="#FDE047" fontSize="12" fontWeight="900" textAnchor="middle">39</text>
          <circle cx="176" cy="111" r="7" fill="#800a14" stroke="url(#cslvGoldRing)" strokeWidth="1.5" />

          <g>
            <path d="M 46 42 L 154 42 L 154 108 C 154 138 100 166 100 166 C 100 166 46 138 46 108 Z" fill="url(#cslvShieldRed)" stroke="url(#cslvGoldRing)" strokeWidth="3.2" />
            <g clipPath="url(#shieldInnerClip)">
              <rect x="44" y="104" width="112" height="65" fill="#6d0811" />
              <path d="M 40 108 L 70 170 L 85 170 L 55 108 Z" fill="#EAB308" />
              <path d="M 70 106 L 102 170 L 118 170 L 86 106 Z" fill="#EAB308" />
              <path d="M 102 104 L 136 170 L 152 170 L 118 104 Z" fill="#EAB308" />
              <path d="M 132 102 L 164 155 L 168 142 L 146 102 Z" fill="#EAB308" />
              <line x1="46" y1="104" x2="154" y2="104" stroke="url(#cslvGoldRing)" strokeWidth="2.5" />
            </g>
            <g transform="translate(4, -2)">
              <path d="M 115 48 C 142 54 146 76 133 94 C 120 108 96 100 93 91 C 110 95 123 84 119 72 C 115 61 96 62 80 72 C 76 75 70 75 73 72 C 84 58 100 46 115 48 Z" fill="url(#cslvGoldRing)" stroke="#682a04" strokeWidth="0.8" />
              <circle cx="68" cy="71" r="10.5" fill="#fef08a" stroke="#682a04" strokeWidth="1.2" />
              <circle cx="68" cy="71" r="4.5" fill="#800a14" />
            </g>
            <g transform="translate(68, 107) scale(0.68)">
              <path d="M 6 42 Q 18 36 28 32 Q 40 20 48 10 Q 52 14 54 18 Q 62 14 66 18 Q 58 24 54 30 Q 56 36 68 44 Q 60 48 48 44 Q 38 46 32 54 L 22 56 Q 26 48 20 46 Z" fill="url(#cslvGoldRing)" stroke="#682a04" strokeWidth="1.2" />
              <path d="M 6 42 Q -12 36 -18 20 Q -4 28 4 32 Q -8 18 2 12 Q 2 24 10 32 Z" fill="url(#cslvGoldRing)" stroke="#682a04" strokeWidth="1" />
            </g>
          </g>
        </svg>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('matches');
      const [userRole, setUserRole] = useState('editor');
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [copiedLinkType, setCopiedLinkType] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('offline');
      const [cloudErrorMsg, setCloudErrorMsg] = useState('');
      const [firebaseModalOpen, setFirebaseModalOpen] = useState(false);
      const [firebaseConfigInput, setFirebaseConfigInput] = useState('');
      const [selectedQrType, setSelectedQrType] = useState('viewer');
      const [showPosterModal, setShowPosterModal] = useState(false);
      const [scheduleViewMode, setScheduleViewMode] = useState('chrono'); // 'chrono' | 'fields'
      const [adminPinModalOpen, setAdminPinModalOpen] = useState(false);
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState('');

      // État Chronomètre officiel (Admin)
      const [timerRunning, setTimerRunning] = useState(false);
      const [timerSeconds, setTimerSeconds] = useState(20 * 60);
      const [timerTotalMinutes, setTimerTotalMinutes] = useState(20);
      const [showTimerModal, setShowTimerModal] = useState(false);

      // État édition d'équipe (Nom)
      const [editingTeamNameModal, setEditingTeamNameModal] = useState(null);
      const [editTeamNameInput, setEditTeamNameInput] = useState('');

      const [config, setConfig] = useState(() => {
        try {
          const s = localStorage.getItem('cslv_config');
          return s ? JSON.parse(s) : {
            name: 'Tournoi du CS La Verpillière',
            adminPin: '1939',
            format: 'groups_knockout',
            numberOfGroups: 2,
            duration: 20,
            breakDuration: 10,
            startTime: '09:00',
            hasLunchBreak: true,

            lunchStart: '12:30',
            lunchEnd: '13:30',
            pointsWin: 3,
            pointsDraw: 1,
            pointsLoss: 0,
            qualifiersPerGroup: 2
          };
        } catch {
          return { name: 'Tournoi du CS La Verpillière', adminPin: '1939', format: 'groups_knockout', numberOfGroups: 2, duration: 20, breakDuration: 10, startTime: '09:00', hasLunchBreak: true, lunchStart: '12:30', lunchEnd: '13:30', pointsWin: 3, pointsDraw: 1, pointsLoss: 0, qualifiersPerGroup: 2 };
        }
      });

      const [fields, setFields] = useState(() => {
        try {
          const s = localStorage.getItem('cslv_fields');
          return s ? JSON.parse(s) : DEFAULT_FIELDS;
        } catch { return DEFAULT_FIELDS; }
      });
      const [newFieldName, setNewFieldName] = useState('');

      const [teams, setTeams] = useState(() => {
        try {
          const s = localStorage.getItem('cslv_teams');
          return s ? JSON.parse(s) : DEMO_TEAMS;
        } catch { return DEMO_TEAMS; }
      });
      const [newTeamName, setNewTeamName] = useState('');
      const [selectedColor, setSelectedColor] = useState(TEAM_COLORS[0]);
      const [editingTeam, setEditingTeam] = useState(null);
      const [selectedTeamSchedule, setSelectedTeamSchedule] = useState(null);
      const [newPlayerInputs, setNewPlayerInputs] = useState({});

      const [matches, setMatches] = useState(() => {
        try {
          const s = localStorage.getItem('cslv_matches');
          return s ? JSON.parse(s) : [];
        } catch { return []; }
      });

      const [editingMatch, setEditingMatch] = useState(null);
      const [goalScorerName, setGoalScorerName] = useState('');
      const [goalTeamId, setGoalTeamId] = useState('');
      const [cardPlayerName, setCardPlayerName] = useState('');
      const [cardTeamId, setCardTeamId] = useState('');
      const [cardType, setCardType] = useState('yellow');
      const [notification, setNotification] = useState(null);

      const isRemoteUpdate = useRef(false);
      const dbRef = useRef(null);

      const showToast = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 3200);
      };

      // Gestion du compte à rebours du Chronomètre
      useEffect(() => {
        let interval = null;
        if (timerRunning) {
          interval = setInterval(() => {
            setTimerSeconds(prev => {
              if (prev <= 1) {
                setTimerRunning(false);
                try {
                  const synth = new Tone.Synth().toDestination();
                  synth.triggerAttackRelease("C5", "0.4");
                  setTimeout(() => synth.triggerAttackRelease("G5", "0.8"), 450);
                } catch(e) {}
                showToast('⏱ Fin du temps réglementaire !', 'success');
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => { if (interval) clearInterval(interval); };
      }, [timerRunning]);

      // Sauvegarde locale automatique
      useEffect(() => {
        try {
          localStorage.setItem('cslv_config', JSON.stringify(config));
          localStorage.setItem('cslv_fields', JSON.stringify(fields));
          localStorage.setItem('cslv_teams', JSON.stringify(teams));
          localStorage.setItem('cslv_matches', JSON.stringify(matches));
        } catch (e) {}
      }, [config, fields, teams, matches]);

      // Détection du rôle dans l'URL
      useEffect(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const role = params.get('role');
          if (role === 'viewer') {
            setUserRole('viewer');
            setActiveTab('matches');
          } else if (role === 'editor') {
            // Si le lien contient le rôle éditeur explicitement
            setUserRole('editor');
          } else {
            // Par défaut si aucun paramètre : mode spectateur sécurisé
            setUserRole('viewer');
            setActiveTab('matches');
          }
        } catch (e) {}
      }, []);

      // Synchronisation Firebase en temps réel
      useEffect(() => {
        let unsubscribe = null;
        async function setupCloud() {
          let fbConfig = null;
          try {
            const params = new URLSearchParams(window.location.search);
            const cloudParam = params.get('cloud');
            if (cloudParam) {
              const decoded = JSON.parse(atob(cloudParam));
              fbConfig = {
                apiKey: decoded.k,
                projectId: decoded.p,
                authDomain: decoded.p + '.firebaseapp.com'
              };
              localStorage.setItem('cslv_firebase_config', JSON.stringify(fbConfig));
            } else {
              const saved = localStorage.getItem('cslv_firebase_config');
              if (saved) fbConfig = JSON.parse(saved);
            }
          } catch (e) {}

          if (!fbConfig || !fbConfig.apiKey || !fbConfig.projectId) {
            setCloudStatus('offline');
            return;
          }

          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(fbConfig);
            }
            const db = firebase.firestore();
            dbRef.current = db;

            try {
              await firebase.auth().signInAnonymously();
            } catch (authErr) {}

            const docRef = db.collection('tournaments').doc('cslv_main_data');

            unsubscribe = docRef.onSnapshot(docSnap => {
              if (docSnap.exists) {
                const data = docSnap.data();
                isRemoteUpdate.current = true;
                if (data.config) setConfig(data.config);
                if (data.fields) setFields(data.fields);
                if (data.teams) setTeams(data.teams);
                if (data.matches) setMatches(data.matches);
                setTimeout(() => { isRemoteUpdate.current = false; }, 300);
              }
              setCloudStatus('online');
              setCloudErrorMsg('');
            }, err => {
              console.warn("Firestore listener:", err);
              setCloudStatus('error');
              setCloudErrorMsg(err.message || 'Erreur d\'accès');
            });
          } catch (err) {
            setCloudStatus('error');
            setCloudErrorMsg(err.message);
          }
        }

        setupCloud();
        return () => { if (unsubscribe) unsubscribe(); };
      }, []);

      // Émission des mises à jour vers le Cloud
      const broadcastUpdate = (newConfig, newFields, newTeams, newMatches) => {
        if (dbRef.current && cloudStatus === 'online' && !isRemoteUpdate.current) {
          try {
            const clean = (obj) => JSON.parse(JSON.stringify(obj, (k, v) => v === undefined ? null : v));
            dbRef.current.collection('tournaments').doc('cslv_main_data').set({
              config: clean(newConfig || config),
              fields: clean(newFields || fields),
              teams: clean(newTeams || teams),
              matches: clean(newMatches || matches),
              updatedAt: new Date().toISOString()
            }, { merge: true }).catch(e => console.error("Cloud push error:", e));
          } catch (err) {
            console.error("Clean error:", err);
          }
        }
      };

      const timeToMinutes = (timeStr) => {
        if (!timeStr) return 0;
        const [h, m] = timeStr.split(':').map(Number);
        return (h || 0) * 60 + (m || 0);
      };

      const minutesToTime = (totalMinutes) => {
        const mins = Math.max(0, Math.floor(totalMinutes));
        const h = Math.floor(mins / 60) % 24;
        const m = mins % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      };

      const getTeam = (id) => teams.find(t => t.id === id) || { name: 'En attente', color: '#64748B', players: [] };

      // Réinitialiser le calendrier (scores & matchs uniquement)
      const handleResetScheduleOnly = () => {
        if (!window.confirm("Êtes-vous sûr de vouloir réinitialiser le calendrier et effacer tous les matchs et scores ? Les équipes seront conservées.")) return;
        setMatches([]);
        broadcastUpdate(config, fields, teams, []);
        showToast("Calendrier des matchs réinitialisé !");
      };

      // Réinitialiser l'ensemble du tournoi (Équipes + Matchs)
      const handleResetWholeTournament = () => {
        if (!window.confirm("ATTENTION : Cette action supprimera TOUTES les équipes, tous les matchs, buteurs et classements. Continuer ?")) return;
        setMatches([]);
        setTeams([]);
        broadcastUpdate(config, fields, [], []);
        showToast("Le tournoi a été entièrement remis à zéro !");
      };

      // Déplacer l'ordre d'un match (Monter / Descendre)
      const handleMoveMatchOrder = (matchId, direction) => {
        const sorted = [...matches].sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
        const index = sorted.findIndex(m => m.id === matchId);
        if (index < 0) return;
        const targetIndex = direction === 'up' ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= sorted.length) return;

        // Échange des horaires et terrains entre les deux matchs
        const currentMatch = sorted[index];
        const targetMatch = sorted[targetIndex];

        const tempStart = currentMatch.startTime;
        const tempEnd = currentMatch.endTime;
        const tempFieldId = currentMatch.fieldId;
        const tempFieldName = currentMatch.fieldName;

        currentMatch.startTime = targetMatch.startTime;
        currentMatch.endTime = targetMatch.endTime;
        currentMatch.fieldId = targetMatch.fieldId;
        currentMatch.fieldName = targetMatch.fieldName;

        targetMatch.startTime = tempStart;
        targetMatch.endTime = tempEnd;
        targetMatch.fieldId = tempFieldId;
        targetMatch.fieldName = tempFieldName;

        const updated = matches.map(m => {
          if (m.id === currentMatch.id) return { ...currentMatch };
          if (m.id === targetMatch.id) return { ...targetMatch };
          return m;
        });

        setMatches(updated);
        broadcastUpdate(config, fields, teams, updated);
        showToast("Ordre du match modifié !");
      };

      // Renommer une équipe
      const handleRenameTeam = () => {
        if (!editingTeamNameModal || !editTeamNameInput.trim()) return;
        const updatedTeams = teams.map(t => t.id === editingTeamNameModal.id ? { ...t, name: editTeamNameInput.trim() } : t);
        setTeams(updatedTeams);
        setEditingTeamNameModal(null);
        setEditTeamNameInput('');
        broadcastUpdate(config, fields, updatedTeams, matches);
        showToast("Nom de l'équipe mis à jour !");
      };

      // Changer une équipe de poule (après génération du calendrier)
      const handleChangeTeamGroup = (teamId, targetGroup) => {
        if (!targetGroup) return;

        // Mise à jour de tous les matchs de poules où cette équipe intervient
        const updatedMatches = matches.map(m => {
          // Si c'est un match de poule contenant cette équipe
          if (m.group && m.group.startsWith('Poule') && (m.team1Id === teamId || m.team2Id === teamId)) {
            return {
              ...m,
              group: targetGroup
            };
          }
          return m;
        });

        setMatches(updatedMatches);
        broadcastUpdate(config, fields, teams, updatedMatches);
        showToast(`Équipe basculée vers ${targetGroup} !`);
      };

      // Échanger deux équipes de poule
      const handleSwapTeamsPool = (teamAId, teamBId) => {
        if (!teamAId || !teamBId || teamAId === teamBId) return;

        const updatedMatches = matches.map(m => {
          let newM = { ...m };
          if (newM.team1Id === teamAId) newM.team1Id = teamBId;
          else if (newM.team1Id === teamBId) newM.team1Id = teamAId;

          if (newM.team2Id === teamAId) newM.team2Id = teamBId;
          else if (newM.team2Id === teamBId) newM.team2Id = teamAId;

          return newM;
        });

        setMatches(updatedMatches);
        broadcastUpdate(config, fields, teams, updatedMatches);
        showToast("Équipes permutées entre les poules avec succès !");
      };

      // Génération de calendrier
      const generateSchedule = () => {
        if (teams.length < 2) {
          showToast('Ajoutez au moins 2 équipes !', 'error');
          return;
        }
        if (fields.length === 0) {
          showToast('Ajoutez au moins un terrain !', 'error');
          return;
        }

        let rawMatches = [];

        if (config.format === 'round_robin') {
          rawMatches = generateRoundRobin(teams, 'Poule Unique');
        } else if (config.format === 'knockout') {
          rawMatches = generateKnockoutTree(teams);
        } else if (config.format === 'multi_groups') {
          // Multi-poules configurables (2, 3 ou 4 poules)
          const numGroups = parseInt(config.numberOfGroups, 10) || 2;
          const groupNames = ['Poule A', 'Poule B', 'Poule C', 'Poule D'].slice(0, numGroups);
          const groups = Array.from({ length: numGroups }, () => []);

          teams.forEach((t, i) => {
            groups[i % numGroups].push(t);
          });

          const allGroupMatches = [];
          groups.forEach((grp, idx) => {
            if (grp.length > 1) {
              const grpMatches = generateRoundRobin(grp, groupNames[idx]);
              allGroupMatches.push(grpMatches);
            }
          });

          // Entrelacer les matchs des différentes poules
          const maxLen = Math.max(...allGroupMatches.map(arr => arr.length), 0);
          for (let i = 0; i < maxLen; i++) {
            allGroupMatches.forEach(grpArr => {
              if (grpArr[i]) rawMatches.push(grpArr[i]);
            });
          }
        } else {
          // Poules A & B + Phase Finale (Classique)
          const half = Math.ceil(teams.length / 2);
          const groupA = teams.slice(0, half);
          const groupB = teams.slice(half);

          const matchesA = generateRoundRobin(groupA, 'Poule A');
          const matchesB = generateRoundRobin(groupB, 'Poule B');

          const interleaved = [];
          const maxLen = Math.max(matchesA.length, matchesB.length);
          for (let i = 0; i < maxLen; i++) {
            if (matchesA[i]) interleaved.push(matchesA[i]);
            if (matchesB[i]) interleaved.push(matchesB[i]);
          }

          const semi1 = {
            id: 'ko-semi-1',
            stage: 'Demi-Finale 1',
            group: 'Phase Finale',
            team1Id: null,
            team2Id: null,
            placeholder1: '1er Poule A',
            placeholder2: '2ème Poule B',
            score1: null,
            score2: null,
            pens1: null,
            pens2: null,
            status: 'pending',
            events: []
          };
          const semi2 = {
            id: 'ko-semi-2',
            stage: 'Demi-Finale 2',
            group: 'Phase Finale',
            team1Id: null,
            team2Id: null,
            placeholder1: '1er Poule B',
            placeholder2: '2ème Poule A',
            score1: null,
            score2: null,
            pens1: null,
            pens2: null,
            status: 'pending',
            events: []
          };
          const finalMatch = {
            id: 'ko-final',
            stage: 'Grande Finale',
            group: 'Phase Finale',
            team1Id: null,
            team2Id: null,
            placeholder1: 'Vainqueur Demi 1',
            placeholder2: 'Vainqueur Demi 2',
            score1: null,
            score2: null,
            pens1: null,
            pens2: null,
            status: 'pending',
            events: []
          };

          rawMatches = [...interleaved, semi1, semi2, finalMatch];
        }

        // Répartition horaire et par terrain
        const matchDur = parseInt(config.duration, 10) || 20;
        const breakDur = parseInt(config.breakDuration, 10) || 10;
        const tourneyStartMin = timeToMinutes(config.startTime || '09:00');
        const lunchStartMin = config.hasLunchBreak ? timeToMinutes(config.lunchStart || '12:30') : -1;
        const lunchEndMin = config.hasLunchBreak ? timeToMinutes(config.lunchEnd || '13:30') : -1;

        const fieldAvailability = fields.map(f => ({
          fieldId: f.id,
          fieldName: f.name,
          nextAvailableMin: tourneyStartMin
        }));

        const scheduled = rawMatches.map((m) => {
          fieldAvailability.sort((a, b) => a.nextAvailableMin - b.nextAvailableMin);
          const chosenField = fieldAvailability[0];

          let startMin = chosenField.nextAvailableMin;
          if (config.hasLunchBreak && startMin < lunchEndMin && (startMin + matchDur) > lunchStartMin) {
            startMin = Math.max(startMin, lunchEndMin);
          }
          const endMin = startMin + matchDur;
          chosenField.nextAvailableMin = endMin + breakDur;

          return {
            ...m,
            fieldId: chosenField.fieldId,
            fieldName: chosenField.fieldName,
            startTime: minutesToTime(startMin),
            endTime: minutesToTime(endMin)
          };
        });

        setMatches(scheduled);
        broadcastUpdate(config, fields, teams, scheduled);
        showToast(`Calendrier généré : ${scheduled.length} matchs prêts !`);
        setActiveTab('matches');
      };

      const generateRoundRobin = (teamList, groupName) => {
        let t = [...teamList];
        if (t.length % 2 !== 0) t.push({ id: 'bye', name: 'Exempt', isBye: true });
        const n = t.length;
        const rounds = n - 1;
        const matchesPerRound = n / 2;
        const result = [];

        for (let round = 0; round < rounds; round++) {
          for (let m = 0; m < matchesPerRound; m++) {
            const home = (round + m) % (n - 1);
            let away = (n - 1 - m + round) % (n - 1);
            if (m === 0) away = n - 1;

            const t1 = t[home];
            const t2 = t[away];

            if (!t1.isBye && !t2.isBye) {
              result.push({
                id: `m-${groupName}-${round + 1}-${t1.id}-${t2.id}`,
                group: groupName,
                stage: `Journée ${round + 1}`,
                team1Id: t1.id,
                team2Id: t2.id,
                score1: null,
                score2: null,
                pens1: null,
                pens2: null,
                status: 'pending',
                events: []
              });
            }
          }
        }
        return result;
      };

      const generateKnockoutTree = (teamList) => {
        const matches = [];
        const n = teamList.length;
        for (let i = 0; i < Math.floor(n / 2); i++) {
          matches.push({
            id: `ko-qf-${i}`,
            stage: n > 4 ? `Quart de Finale ${i + 1}` : `Demi-Finale ${i + 1}`,
            group: 'Phase Finale',
            team1Id: teamList[i * 2]?.id || null,
            team2Id: teamList[i * 2 + 1]?.id || null,
            score1: null,
            score2: null,
            status: 'pending',
            events: []
          });
        }
        return matches;
      };

      // Gestion des Terrains
      const handleAddField = () => {
        if (!newFieldName.trim()) return;
        const newFields = [...fields, { id: `f-${Date.now()}`, name: newFieldName.trim() }];
        setFields(newFields);
        setNewFieldName('');
        broadcastUpdate(config, newFields, teams, matches);
        showToast('Terrain ajouté');
      };

      const handleRemoveField = (id) => {
        if (fields.length <= 1) {
          showToast('Conservez au moins un terrain !', 'error');
          return;
        }
        const updated = fields.filter(f => f.id !== id);
        setFields(updated);
        broadcastUpdate(config, updated, teams, matches);
      };

      // Gestion des Équipes
      const handleAddTeam = () => {
        if (!newTeamName.trim()) return;
        const newTeam = {
          id: `t-${Date.now()}`,
          name: newTeamName.trim(),
          color: selectedColor,
          players: []
        };
        const updated = [...teams, newTeam];
        setTeams(updated);
        setNewTeamName('');
        broadcastUpdate(config, fields, updated, matches);
        showToast(`Équipe "${newTeam.name}" inscrite !`);
      };

      const handleRemoveTeam = (id) => {
        const updated = teams.filter(t => t.id !== id);
        setTeams(updated);
        broadcastUpdate(config, fields, updated, matches);
        showToast('Équipe retirée');
      };

      const handleAddPlayerToTeam = (teamId, pName) => {
        if (!pName || !pName.trim()) return;
        const updated = teams.map(t => {
          if (t.id === teamId) {
            return { ...t, players: [...(t.players || []), pName.trim()] };
          }
          return t;
        });
        setTeams(updated);
        setNewPlayerInputs({ ...newPlayerInputs, [teamId]: '' });
        broadcastUpdate(config, fields, updated, matches);
        showToast('Joueur ajouté à l\'effectif');
      };

      const handleRemovePlayerFromTeam = (teamId, idx) => {
        const updated = teams.map(t => {
          if (t.id === teamId) {
            const p = [...(t.players || [])];
            p.splice(idx, 1);
            return { ...t, players: p };
          }
          return t;
        });
        setTeams(updated);
        broadcastUpdate(config, fields, updated, matches);
      };

      // Calcul des Classements
      const calculateStandings = (groupFilter = null) => {
        const table = {};
        teams.forEach(t => {
          table[t.id] = { team: t, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, gd: 0, points: 0, form: [] };
        });

        matches.forEach(m => {
          if (m.status === 'finished' && m.team1Id && m.team2Id) {
            if (groupFilter && m.group !== groupFilter) return;

            const s1 = Number(m.score1 ?? 0);
            const s2 = Number(m.score2 ?? 0);
            const t1 = table[m.team1Id];
            const t2 = table[m.team2Id];

            if (t1 && t2) {
              t1.played++;
              t2.played++;
              t1.gf += s1;
              t1.ga += s2;
              t2.gf += s2;
              t2.ga += s1;

              if (s1 > s2) {
                t1.won++;
                t1.points += config.pointsWin;
                t1.form.push('W');
                t2.lost++;
                t2.points += config.pointsLoss;
                t2.form.push('L');
              } else if (s1 < s2) {
                t2.won++;
                t2.points += config.pointsWin;
                t2.form.push('W');
                t1.lost++;
                t1.points += config.pointsLoss;
                t1.form.push('L');
              } else {
                t1.drawn++;
                t2.drawn++;
                t1.points += config.pointsDraw;
                t2.points += config.pointsDraw;
                t1.form.push('D');
                t2.form.push('D');
              }
              t1.gd = t1.gf - t1.ga;
              t2.gd = t2.gf - t2.ga;
            }
          }
        });

        const list = Object.values(table);
        const filtered = groupFilter 
          ? list.filter(r => matches.some(m => m.group === groupFilter && (m.team1Id === r.team.id || m.team2Id === r.team.id)))
          : list;

        return filtered.sort((a, b) => b.points !== a.points ? b.points - a.points : b.gd !== a.gd ? b.gd - a.gd : b.gf - a.gf);
      };

      // Sauvegarde du match
      const saveMatchDetails = () => {
        if (!editingMatch) return;
        let updated = matches.map(m => m.id === editingMatch.id ? editingMatch : m);

        // Progression auto vers les demi-finales si les poules sont terminées
        if (config.format === 'groups_knockout') {
          const stA = calculateStandings('Poule A');
          const stB = calculateStandings('Poule B');
          const finA = updated.filter(m => m.group === 'Poule A').every(m => m.status === 'finished');
          const finB = updated.filter(m => m.group === 'Poule B').every(m => m.status === 'finished');

          if (finA && stA.length >= 2) {
            updated = updated.map(m => {
              if (m.id === 'ko-semi-1') return { ...m, team1Id: stA[0].team.id };
              if (m.id === 'ko-semi-2') return { ...m, team2Id: stA[1].team.id };
              return m;
            });
          }
          if (finB && stB.length >= 2) {
            updated = updated.map(m => {
              if (m.id === 'ko-semi-2') return { ...m, team1Id: stB[0].team.id };
              if (m.id === 'ko-semi-1') return { ...m, team2Id: stB[1].team.id };
              return m;
            });
          }

          // Progression en finale
          const s1 = updated.find(m => m.id === 'ko-semi-1');
          const s2 = updated.find(m => m.id === 'ko-semi-2');
          const getWinner = (m) => {
            if (!m || m.status !== 'finished') return null;
            if (m.score1 > m.score2) return m.team1Id;
            if (m.score2 > m.score1) return m.team2Id;
            if ((m.pens1 || 0) > (m.pens2 || 0)) return m.team1Id;
            return m.team2Id;
          };
          const w1 = getWinner(s1);
          const w2 = getWinner(s2);
          updated = updated.map(m => {
            if (m.id === 'ko-final') {
              return { ...m, team1Id: w1 || m.team1Id, team2Id: w2 || m.team2Id };
            }
            return m;
          });
        }

        setMatches(updated);
        broadcastUpdate(config, fields, teams, updated);
        setEditingMatch(null);
        showToast('Score et match enregistrés !');
      };

      // Statistiques globales
      const stats = useMemo(() => {
        const scorers = {};
        const mvps = {};
        let totalGoals = 0;
        let totalCards = 0;

        matches.forEach(m => {
          if (m.mvp) {
            mvps[m.mvp] = (mvps[m.mvp] || 0) + 1;
          }
          if (m.events) {
            m.events.forEach(e => {
              if (e.type === 'goal') {
                totalGoals++;
                const key = `${e.player}__${e.teamId}`;
                scorers[key] = scorers[key] || { player: e.player, teamId: e.teamId, count: 0 };
                scorers[key].count++;
              }
              if (e.type === 'yellow' || e.type === 'red') totalCards++;
            });
          }
        });

        const topScorers = Object.values(scorers).sort((a, b) => b.count - a.count).slice(0, 5);
        const topMvps = Object.entries(mvps).map(([player, count]) => ({ player, count })).sort((a, b) => b.count - a.count);

        return {
          topScorers,
          topMvps,
          totalGoals,
          totalCards,
          completedMatches: matches.filter(m => m.status === 'finished').length,
          totalMatches: matches.length
        };
      }, [matches]);

      // Liens de partage complets
      const buildShareUrl = (role) => {
        let base = OFFICIAL_PUBLIC_URL;
        let query = `?role=${role}`;
        try {
          const saved = localStorage.getItem('cslv_firebase_config');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.apiKey && parsed.projectId) {
              const mini = { k: parsed.apiKey, p: parsed.projectId };
              query += `&cloud=${btoa(JSON.stringify(mini))}`;
            }
          }
        } catch (e) {}
        return `${base}${query}`;
      };

      const copyToClipboard = (text, type) => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setCopiedLinkType(type);
          showToast('Lien copié dans le presse-papier !');
          setTimeout(() => setCopiedLinkType(null), 2500);
        } catch (e) {
          showToast('Erreur de copie', 'error');
        }
      };

      return (
        <div className="min-h-screen bg-[#0e0708] text-slate-100 flex flex-col font-sans">
          {/* Notification Toast */}
          {notification && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl border text-xs sm:text-sm font-bold shadow-2xl transition animate-bounce ${
              notification.type === 'error' ? 'bg-rose-950 border-rose-600 text-rose-200' : 'bg-red-950 border-amber-500 text-amber-200'
            }`}>
              {notification.message}
            </div>
          )}

          {/* En-tête officiel Sang et Or */}
          <header className="border-b border-red-950 bg-gradient-to-r from-[#200507] via-[#160507] to-[#1c0608] sticky top-0 z-40 shadow-xl">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <ClubLogo className="w-11 h-11 sm:w-12 sm:h-12" />
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-black text-base sm:text-lg text-white leading-tight">{config.name}</h1>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase ${
                      userRole === 'editor' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-red-500/20 text-red-300 border border-red-500/30'
                    }`}>
                      {userRole === 'editor' ? 'Organisateur' : 'Spectateur'}
                    </span>
                  </div>
                  <div className="flex items-center gap-2 text-[11px] text-amber-400 font-semibold">
                    <span>CS La Verpillière 1939</span>
                    <span className="text-slate-400">•</span>
                    <span className={cloudStatus === 'online' ? 'text-emerald-400 font-bold flex items-center gap-1' : 'text-slate-400'}>
                      {cloudStatus === 'online' && <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>}
                      {cloudStatus === 'online' ? 'En direct (Cloud)' : (
                        <button 
                          onClick={() => setFirebaseModalOpen(true)} 
                          className="hover:text-amber-400 underline decoration-dotted text-slate-400 font-medium"
                          title="Cliquer pour configurer ou reconnecter le Cloud"
                        >
                          Mode Local (⚡ Reconnecter)
                        </button>
                      )}
                    </span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5 sm:gap-2">
                {userRole === 'editor' && (
                  <button
                    onClick={() => setShowTimerModal(true)}
                    className="px-2.5 py-1.5 rounded-lg border border-amber-500/60 bg-[#1f080c] hover:bg-[#300c14] text-xs font-black text-amber-300 transition flex items-center gap-1 shadow-md"
                    title="Ouvrir le chronomètre de match"
                  >
                    ⏱ {minutesToTime(Math.floor(timerSeconds / 60))}:{String(timerSeconds % 60).padStart(2, '0')}
                  </button>
                )}

                {userRole === 'editor' ? (
                  <button
                    onClick={() => {
                      setUserRole('viewer');
                      if (activeTab === 'config') setActiveTab('matches');
                      showToast('Mode Spectateur activé');
                    }}
                    className="px-2.5 py-1.5 rounded-lg border border-red-900/60 bg-[#1f080c] hover:bg-[#2d0c12] text-xs font-bold text-amber-300 transition"
                    title="Basculer vers la vue publique spectateur"
                  >
                    👁 Vue Spectateur
                  </button>
                ) : (
                  <button
                    onClick={() => {
                      setPinInput('');
                      setPinError('');
                      setAdminPinModalOpen(true);
                    }}
                    className="px-2.5 py-1.5 rounded-lg border border-amber-600/50 bg-[#1f080c] hover:bg-[#2d0c12] text-xs font-bold text-amber-400 transition flex items-center gap-1"
                    title="Déverrouiller le mode organisateur avec le code PIN"
                  >
                    🔒 Accès Organisateur
                  </button>
                )}

                <button
                  onClick={() => setIsShareModalOpen(true)}
                  className="px-3 py-1.5 rounded-lg bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-black text-xs shadow-md transition"
                >
                  Partager
                </button>
              </div>
            </div>

            {/* Barre de navigation des onglets */}
            <div className="max-w-7xl mx-auto px-2 sm:px-6 flex space-x-1 sm:space-x-2 overflow-x-auto py-2 no-scrollbar border-t border-red-950 bg-black/25">
              {userRole === 'editor' && (
                <button
                  onClick={() => setActiveTab('config')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                    activeTab === 'config' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40 shadow' : 'text-zinc-400 hover:text-white'
                  }`}
                >
                  ⚙ Configuration & Terrains
                </button>
              )}
              <button
                onClick={() => setActiveTab('teams')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                  activeTab === 'teams' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40 shadow' : 'text-zinc-400 hover:text-white'
                }`}
              >
                👥 Équipes ({teams.length})
              </button>
              <button
                onClick={() => setActiveTab('matches')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                  activeTab === 'matches' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40 shadow' : 'text-zinc-400 hover:text-white'
                }`}
              >
                📅 Matchs ({matches.length})
              </button>
              <button
                onClick={() => setActiveTab('standings')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                  activeTab === 'standings' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40 shadow' : 'text-zinc-400 hover:text-white'
                }`}
              >
                📊 Classement
              </button>
              {config.format !== 'round_robin' && (
                <button
                  onClick={() => setActiveTab('bracket')}
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                    activeTab === 'bracket' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40 shadow' : 'text-zinc-400 hover:text-white'
                  }`}
                >
                  🏆 Phase Finale
                </button>
              )}
              <button
                onClick={() => setActiveTab('stats')}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                  activeTab === 'stats' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40 shadow' : 'text-zinc-400 hover:text-white'
                }`}
              >
                🔥 Statistiques
              </button>
            </div>
          </header>

          {/* Corps de l'application */}
          <main className="flex-1 max-w-7xl mx-auto w-full px-3 sm:px-6 py-4 sm:py-6">
            
            {/* ONGLET 1 : CONFIGURATION */}
            {activeTab === 'config' && userRole === 'editor' && (
              <div className="space-y-6">
                <div className="bg-[#150709] border border-red-950 rounded-2xl p-4 sm:p-6 shadow-xl space-y-6">
                  <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                    <div>
                      <h2 className="text-lg font-bold text-white mb-1">Paramètres du Tournoi</h2>
                      <p className="text-xs text-slate-400">Configurez le nom, la formule, les poules multiples, terrains et horaires.</p>
                    </div>

                    <div className="flex items-center gap-2">
                      <button
                        onClick={handleResetScheduleOnly}
                        className="px-3 py-1.5 bg-[#25090d] hover:bg-[#380e14] text-amber-400 border border-amber-500/40 rounded-xl text-xs font-bold transition flex items-center gap-1"
                        title="Effacer le calendrier et les scores des matchs tout en gardant les équipes"
                      >
                        🔄 Réinitialiser calendrier
                      </button>
                      <button
                        onClick={handleResetWholeTournament}
                        className="px-3 py-1.5 bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-600/50 rounded-xl text-xs font-bold transition flex items-center gap-1"
                        title="Remettre tout le tournoi à zéro"
                      >
                        ⚠️ Réinitialiser tournoi
                      </button>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1.5">Nom du Tournoi</label>
                      <input
                        type="text"
                        value={config.name}
                        onChange={(e) => setConfig({ ...config, name: e.target.value })}
                        className="w-full bg-[#0b0304] border border-red-900/60 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1.5">Code PIN Organisateur (Sécurité)</label>
                      <input
                        type="text"
                        value={config.adminPin || '1939'}
                        onChange={(e) => setConfig({ ...config, adminPin: e.target.value })}
                        placeholder="1939"
                        className="w-full bg-[#0b0304] border border-red-900/60 rounded-xl px-3.5 py-2 text-sm text-amber-300 font-mono font-bold focus:outline-none focus:border-amber-500"
                      />
                    </div>
                    <div className="sm:col-span-2">
                      <label className="block text-xs font-bold text-slate-300 uppercase mb-1.5">Formule sportive</label>
                      <select
                        value={config.format}
                        onChange={(e) => setConfig({ ...config, format: e.target.value })}
                        className="w-full bg-[#0b0304] border border-red-900/60 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                      >
                        <option value="groups_knockout">Poules A & B + Phase Finale (Recommandé - 2 poules + Quarts/Demies/Finale)</option>
                        <option value="multi_groups">Multiples Poules (2, 3 ou 4 poules sans élimination directe)</option>
                        <option value="round_robin">Championnat Unique (1 seule poule où tout le monde se rencontre)</option>
                        <option value="knockout">Coupe directe (Élimination directe / Bracket)</option>
                      </select>
                    </div>

                    {config.format === 'multi_groups' && (
                      <div className="sm:col-span-2 bg-[#0b0304] p-3 rounded-xl border border-red-900/60">
                        <label className="block text-xs font-bold text-amber-300 uppercase mb-1.5">Nombre de poules à créer</label>
                        <select
                          value={config.numberOfGroups || 2}
                          onChange={(e) => setConfig({ ...config, numberOfGroups: parseInt(e.target.value, 10) || 2 })}
                          className="w-full bg-[#18080a] border border-red-900/60 rounded-xl px-3 py-2 text-xs text-white font-bold"
                        >
                          <option value="2">2 Poules (Poule A et Poule B)</option>
                          <option value="3">3 Poules (Poule A, Poule B et Poule C)</option>

                    onChange={(e) => setEditTeamNameInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleRenameTeam()}
                    className="w-full bg-[#0b0304] border border-red-900 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-amber-500"
                    autoFocus
                  />
                </div>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setEditingTeamNameModal(null)} className="px-3 py-1.5 text-xs text-slate-400">Annuler</button>
                  <button onClick={handleRenameTeam} className="px-4 py-1.5 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-bold rounded-xl text-xs">
                    Enregistrer
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODALE FEUILLE DE MATCH */}
          {editingMatch && userRole === 'editor' && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-center justify-center p-3 sm:p-4">
              <div className="bg-[#150709] border border-red-900 rounded-2xl max-w-lg w-full p-4 sm:p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center pb-2 border-b border-red-950">
                  <div>
                    <h3 className="font-bold text-white text-base">Feuille de Match</h3>
                    <div className="flex items-center gap-2 mt-1">
                      <span className="bg-red-950 border border-red-900/60 text-xs text-amber-300 font-bold px-2.5 py-1 rounded">
                        {editingMatch.group || 'Match'}
                      </span>

                      <input
                        type="text"
                        value={editingMatch.stage || 'Match'}
                        onChange={(e) => setEditingMatch({ ...editingMatch, stage: e.target.value })}
                        placeholder="Journée 1, Demi-Finale..."
                        className="bg-[#0b0304] border border-red-900/60 text-xs text-white px-2 py-1 rounded w-36 font-bold"
                      />
                    </div>
                  </div>
                  <button onClick={() => setEditingMatch(null)} className="text-slate-400 hover:text-white p-1">✕</button>
                </div>

                {/* Score */}
                <div className="grid grid-cols-5 items-center bg-[#0b0304] p-3 rounded-xl border border-red-950 text-center">
                  <div className="col-span-2">
                    <span className="text-xs font-bold text-slate-300 block truncate mb-1">{getTeam(editingMatch.team1Id).name}</span>
                    <input
                      type="number"
                      min="0"
                      value={editingMatch.score1 ?? ''}
                      placeholder="0"
                      onChange={(e) => setEditingMatch({ ...editingMatch, score1: e.target.value === '' ? null : parseInt(e.target.value) })}
                      className="w-16 h-12 bg-[#18080a] border border-red-900 text-center font-mono font-black text-2xl text-white rounded-xl mx-auto block"
                    />
                  </div>
                  <span className="col-span-1 font-black text-amber-500 text-sm">VS</span>
                  <div className="col-span-2">
                    <span className="text-xs font-bold text-slate-300 block truncate mb-1">{getTeam(editingMatch.team2Id).name}</span>
                    <input
                      type="number"
                      min="0"
                      value={editingMatch.score2 ?? ''}
                      placeholder="0"
                      onChange={(e) => setEditingMatch({ ...editingMatch, score2: e.target.value === '' ? null : parseInt(e.target.value) })}
                      className="w-16 h-12 bg-[#18080a] border border-red-900 text-center font-mono font-black text-2xl text-white rounded-xl mx-auto block"
                    />
                  </div>
                </div>

                {/* Statut du match */}
                <div>
                  <span className="text-[11px] font-bold text-slate-400 uppercase block mb-1.5">Statut de la rencontre</span>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { id: 'pending', label: 'À venir' },
                      { id: 'live', label: 'En direct' },
                      { id: 'finished', label: 'Terminé' }
                    ].map(st => (
                      <button
                        key={st.id}
                        onClick={() => setEditingMatch({ ...editingMatch, status: st.id })}
                        className={`py-2 text-xs font-bold rounded-xl border transition ${
                          editingMatch.status === st.id ? 'bg-amber-500 text-slate-950 border-amber-400' : 'bg-[#0b0304] border-red-950 text-slate-400'
                        }`}
                      >
                        {st.label}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Homme du Match */}
                <div className="bg-[#0b0304] p-3 rounded-xl border border-red-950 space-y-2">
                  <span className="text-xs font-bold text-amber-300 block">⭐ Homme du Match (MVP)</span>
                  {(() => {
                    const t1 = getTeam(editingMatch.team1Id);
                    const t2 = getTeam(editingMatch.team2Id);
                    const allPlayers = [
                      ...(t1.players || []).map(p => ({ player: p, teamName: t1.name })),
                      ...(t2.players || []).map(p => ({ player: p, teamName: t2.name }))
                    ];
                    return (
                      <div className="space-y-1.5">
                        <select
                          value={editingMatch.mvp || ''}
                          onChange={(e) => setEditingMatch({ ...editingMatch, mvp: e.target.value })}
                          className="w-full bg-[#18080a] border border-red-900/60 rounded-lg p-2 text-xs text-white"
                        >
                          <option value="">-- Choisir le meilleur joueur du match --</option>
                          {allPlayers.length > 0 ? (
                            allPlayers.map((item, idx) => (
                              <option key={idx} value={item.player}>
                                {item.player} ({item.teamName})
                              </option>
                            ))
                          ) : (
                            <option disabled value="">Aucun joueur dans les effectifs (saisir manuellement ci-dessous)</option>
                          )}
                        </select>
                        <input
                          type="text"
                          placeholder="Ou saisir un nom manuellement..."
                          value={editingMatch.mvp || ''}
                          onChange={(e) => setEditingMatch({ ...editingMatch, mvp: e.target.value })}
                          className="w-full bg-[#18080a] border border-red-900/60 rounded-lg px-2.5 py-1 text-[11px] text-slate-300 placeholder-slate-600"
                        />
                      </div>
                    );
                  })()}
                </div>

                {/* Ajouter un buteur */}
                <div className="bg-[#0b0304] p-3 rounded-xl border border-red-950 space-y-2">
                  <span className="text-xs font-bold text-amber-300 block">⚽ Ajouter un But</span>
                  <div className="flex flex-col sm:flex-row gap-2">
                    <select
                      value={goalTeamId || editingMatch.team1Id || ''}
                      onChange={(e) => {
                        setGoalTeamId(e.target.value);
                        setGoalScorerName('');
                      }}
                      className="bg-[#18080a] border border-red-900/60 rounded-lg p-1.5 text-xs text-white"
                    >
                      <option value={editingMatch.team1Id}>{getTeam(editingMatch.team1Id).name}</option>
                      <option value={editingMatch.team2Id}>{getTeam(editingMatch.team2Id).name}</option>
                    </select>

                    {(() => {
                      const currentTeamId = goalTeamId || editingMatch.team1Id;
                      const activeTeam = getTeam(currentTeamId);
                      const players = activeTeam.players || [];
                      return (
                        <div className="flex-1 flex gap-1.5">
                          <select
                            value={goalScorerName}
                            onChange={(e) => setGoalScorerName(e.target.value)}
                            className="flex-1 bg-[#18080a] border border-red-900/60 rounded-lg p-1.5 text-xs text-white"
                          >
                            <option value="">-- Choisir le buteur --</option>
                            {players.map((p, idx) => (
                              <option key={idx} value={p}>{p}</option>
                            ))}
                            <option value="__custom__">Autre (saisie libre)</option>
                          </select>
                          {(!players.length || goalScorerName === '__custom__') && (
                            <input
                              type="text"
                              placeholder="Nom..."
                              onChange={(e) => setGoalScorerName(e.target.value)}
                              className="w-28 bg-[#18080a] border border-red-900/60 rounded-lg p-1.5 text-xs text-white"
                            />
                          )}
                        </div>
                      );
                    })()}
                  </div>
                  <button
                    onClick={() => {
                      const finalName = goalScorerName === '__custom__' ? '' : goalScorerName;
                      const effectiveTeamId = goalTeamId || editingMatch.team1Id;
                      if (!finalName.trim() || !effectiveTeamId) return;
                      const isT1 = effectiveTeamId === editingMatch.team1Id;
                      setEditingMatch({
                        ...editingMatch,
                        score1: isT1 ? (Number(editingMatch.score1) || 0) + 1 : Number(editingMatch.score1) || 0,
                        score2: !isT1 ? (Number(editingMatch.score2) || 0) + 1 : Number(editingMatch.score2) || 0,
                        events: [...(editingMatch.events || []), { id: Date.now(), type: 'goal', player: finalName.trim(), teamId: effectiveTeamId }]
                      });
                      setGoalScorerName('');
                    }}
                    className="w-full py-1.5 bg-[#20080c] text-amber-300 font-bold rounded-lg text-xs border border-amber-500/30"
                  >
                    + Enregistrer le but (+1 score)
                  </button>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-red-950">
                  <button onClick={() => setEditingMatch(null)} className="px-3 py-1.5 text-xs text-slate-400">Annuler</button>
                  <button onClick={saveMatchDetails} className="px-5 py-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black rounded-xl text-xs">
                    Valider & Enregistrer
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Composant Tableau du Classement
    function StandingsTable({ standings }) {
      if (!standings || standings.length === 0) {
        return <div className="text-center py-6 text-xs text-slate-500 italic">Aucune donnée disponible.</div>;
      }
      return (
        <div className="overflow-x-auto">
          <table className="w-full text-left text-xs">
            <thead>
              <tr className="border-b border-red-950 text-slate-400 uppercase tracking-wider font-semibold">
                <th className="py-2 px-1 text-center w-6">#</th>
                <th className="py-2 px-2">Club</th>
                <th className="py-2 px-1 text-center font-bold text-amber-300">PTS</th>
                <th className="py-2 px-1 text-center">J</th>
                <th className="py-2 px-1 text-center">G</th>
                <th className="py-2 px-1 text-center">N</th>
                <th className="py-2 px-1 text-center">P</th>
                <th className="py-2 px-1 text-center">BP</th>
                <th className="py-2 px-1 text-center">BC</th>
                <th className="py-2 px-1 text-center">+/-</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-red-950/60 font-medium">
              {standings.map((r, idx) => (
                <tr key={r.team.id} className={idx < 2 ? 'bg-amber-500/5' : ''}>
                  <td className="py-2.5 px-1 text-center font-bold">
                    <span className={`inline-flex items-center justify-center w-5 h-5 rounded ${idx === 0 ? 'bg-amber-400 text-slate-950 font-black' : idx === 1 ? 'bg-red-900 text-amber-200' : 'text-slate-500'}`}>
                      {idx + 1}
                    </span>
                  </td>
                  <td className="py-2.5 px-2">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: r.team.color }}></span>
                      <span className="font-bold text-white truncate">{r.team.name}</span>
                    </div>
                  </td>
                  <td className="py-2.5 px-1 text-center font-black text-amber-300 bg-amber-500/10">{r.points}</td>
                  <td className="py-2.5 px-1 text-center text-slate-300">{r.played}</td>
                  <td className="py-2.5 px-1 text-center text-slate-300">{r.won}</td>
                  <td className="py-2.5 px-1 text-center text-slate-300">{r.drawn}</td>
                  <td className="py-2.5 px-1 text-center text-slate-300">{r.lost}</td>
                  <td className="py-2.5 px-1 text-center text-slate-400">{r.gf}</td>
                  <td className="py-2.5 px-1 text-center text-slate-400">{r.ga}</td>
                  <td className={`py-2.5 px-1 text-center font-bold ${r.gd > 0 ? 'text-amber-400' : r.gd < 0 ? 'text-rose-400' : 'text-slate-400'}`}>
                    {r.gd > 0 ? `+${r.gd}` : r.gd}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
