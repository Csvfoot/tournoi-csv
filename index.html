<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournoi CS La Verpillière - 1939</title>
  
  <!-- Tailwind CSS pour le style moderne Sang et Or -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React, ReactDOM et Babel pour exécuter l'application directement dans le navigateur -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Scripts UMD Compatibles (Chargement direct sans bug) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- Lucide Icons autonomes -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Générateur de QR Code autonome pour affichage direct à l'écran -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@700&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0e0708;
      color: #f1f5f9;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Masquer la scrollbar tout en permettant le défilement */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-qr-poster, #printable-qr-poster * {
        visibility: visible;
      }
      #printable-qr-poster {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        display: block !important;
        background: white !important;
        color: black !important;
      }
    }
  </style>
</head>
<body class="selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const TEAM_COLORS = [
      '#DC2626', '#EAB308', '#991B1B', '#F59E0B', 
      '#B91C1C', '#FBBF24', '#7F1D1D', '#3B82F6'
    ];

    const DEFAULT_FIELDS = [
      { id: 'f1', name: 'Terrain Honneur (Pelouse)' },
      { id: 'f2', name: 'Terrain Annexe (Synthétique)' }
    ];

    const DEMO_TEAMS = [
      { id: 't1', name: 'CS La Verpillière (1)', color: '#DC2626', players: ['Enzo R.', 'Lucas M.', 'Alexandre G.', 'Sofiane B.'] },
      { id: 't2', name: 'CS La Verpillière (2)', color: '#EAB308', players: ['Hugo L.', 'Kylian V.', 'Antoine P.', 'Marc T.'] },
      { id: 't3', name: 'Olympique Nord Isère', color: '#B91C1C', players: ['Romain F.', 'Youssef H.', 'Clément M.', 'Maxime B.'] },
      { id: 't4', name: 'FC Vallée du Guiers', color: '#F59E0B', players: ['Karim Z.', 'Benoît R.', 'David S.', 'Thomas N.'] },
      { id: 't5', name: 'AS Saint-Quentin', color: '#991B1B', players: ['Gabriel K.', 'Paul E.', 'Julien D.', 'Florian C.'] },
      { id: 't6', name: 'Bourgoin Jallieu FC', color: '#FBBF24', players: ['Adrien B.', 'Loïc V.', 'Quentin R.', 'Samir A.'] },
      { id: 't7', name: 'FC L\'Isle d\'Abeau', color: '#7F1D1D', players: ['Nicolas M.', 'Mathieu J.', 'Sébastien L.', 'Dylan P.'] },
      { id: 't8', name: 'US Villefontaine', color: '#3B82F6', players: ['Valentin B.', 'Théo C.', 'Arthur G.', 'Pierre F.'] }
    ];

    // Blason Officiel CS La Verpillière
    function ClubLogo({ className = "w-11 h-11", customLogo = null }) {
      if (customLogo) {
        return (
          <img 
            src={customLogo} 
            alt="Logo CS La Verpillière" 
            className={`${className} object-contain rounded-full shadow-md border-2 border-amber-400`}
          />

      }

      return (
        <svg 
          viewBox="0 0 200 200" 
          className={`${className} flex-shrink-0 drop-shadow-[0_4px_8px_rgba(234,179,8,0.35)]`}
        >
          <defs>
            <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#FDE047" />
              <stop offset="35%" stopColor="#EAB308" />
              <stop offset="70%" stopColor="#CA8A04" />
              <stop offset="100%" stopColor="#FEF08A" />
            </linearGradient>
            <radialGradient id="redBadge" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stopColor="#991B1B" />
              <stop offset="60%" stopColor="#7F1D1D" />
              <stop offset="100%" stopColor="#450A0A" />
            </radialGradient>
            <linearGradient id="shieldRed" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stopColor="#B91C1C" />
              <stop offset="100%" stopColor="#5B0E0E" />
            </linearGradient>
            <clipPath id="shieldClip">
              <path d="M 50 48 L 150 48 C 150 48 152 105 150 115 C 147 135 100 162 100 162 C 100 162 53 135 50 115 Z" />
            </clipPath>
            <path id="textCircleTop" d="M 32,100 A 68,68 0 1,1 168,100" />
            <path id="textCircleBottom" d="M 168,100 A 68,68 0 0,1 32,100" />
          </defs>

          <circle cx="100" cy="100" r="96" fill="url(#goldRing)" />
          <circle cx="100" cy="100" r="92" fill="#450A0A" />
          <circle cx="100" cy="100" r="88" fill="url(#redBadge)" stroke="url(#goldRing)" strokeWidth="2.5" />
          <circle cx="100" cy="100" r="68" fill="none" stroke="url(#goldRing)" strokeWidth="2" />

          <text fill="#FFFFFF" fontSize="13" fontWeight="900" letterSpacing="2.5" fontFamily="sans-serif">
            <textPath href="#textCircleTop" startOffset="50%" textAnchor="middle">
              CLUB SPORTIF
            </textPath>
          </text>

          <text fill="#FFFFFF" fontSize="11.5" fontWeight="900" letterSpacing="2.5" fontFamily="sans-serif">
            <textPath href="#textCircleBottom" startOffset="50%" textAnchor="middle">
              LA VERPILLIÈRE
            </textPath>
          </text>

          <text x="28" y="96" fill="#FDE047" fontSize="11" fontWeight="bold" textAnchor="middle" fontFamily="sans-serif">19</text>
          <circle cx="28" cy="110" r="6.5" fill="#B91C1C" stroke="url(#goldRing)" strokeWidth="1.5" />
          <path d="M 24 110 Q 28 106 32 110 M 28 104 L 28 116" stroke="url(#goldRing)" strokeWidth="1" />

          <text x="172" y="96" fill="#FDE047" fontSize="11" fontWeight="bold" textAnchor="middle" fontFamily="sans-serif">39</text>
          <circle cx="172" cy="110" r="6.5" fill="#B91C1C" stroke="url(#goldRing)" strokeWidth="1.5" />
          <path d="M 168 110 Q 172 106 176 110 M 172 104 L 172 116" stroke="url(#goldRing)" strokeWidth="1" />

          <g>
            <path d="M 50 48 L 150 48 C 150 48 152 105 150 115 C 147 135 100 162 100 162 C 100 162 53 135 50 115 Z" fill="url(#shieldRed)" stroke="url(#goldRing)" strokeWidth="3" />
            
            <g clipPath="url(#shieldClip)">
              <path d="M 45 106 L 155 106 L 155 170 L 45 170 Z" fill="#991B1B" />
              <path d="M 40 112 L 65 170 L 80 170 L 55 112 Z" fill="#EAB308" opacity="0.95" />
              <path d="M 68 110 L 98 170 L 113 170 L 83 110 Z" fill="#EAB308" opacity="0.95" />
              <path d="M 98 108 L 132 170 L 147 170 L 113 108 Z" fill="#EAB308" opacity="0.95" />
              <path d="M 128 106 L 158 155 L 165 145 L 143 106 Z" fill="#EAB308" opacity="0.95" />
              <line x1="50" y1="106" x2="150" y2="106" stroke="url(#goldRing)" strokeWidth="2.5" />
            </g>

            {/* Dauphin */}
            <path 
              d="M 120 48 C 145 54 148 76 135 94 C 122 108 98 100 95 91 C 112 95 125 84 121 72 C 117 61 98 62 82 72 C 78 75 72 75 75 72 C 86 58 102 46 120 48 Z" 
              fill="url(#goldRing)" 
              stroke="#78350F" 
              strokeWidth="0.8" 
            />
            <path d="M 92 88 C 86 98 100 102 110 99 C 102 96 98 92 92 88 Z" fill="url(#goldRing)" />
            <path d="M 93 91 L 88 105 L 102 101 L 108 105 Z" fill="url(#goldRing)" stroke="#78350F" strokeWidth="0.6" />
            
            {/* Ballon */}
            <circle cx="72" cy="71" r="9" fill="#FEF08A" stroke="#78350F" strokeWidth="1" />
            <circle cx="72" cy="71" r="4" fill="#991B1B" />
            <path d="M 72 62 L 72 67 M 72 75 L 72 80 M 63 71 L 68 71 M 76 71 L 81 71" stroke="#991B1B" strokeWidth="0.8" />

            {/* Renard */}
            <g transform="translate(68, 107) scale(0.68)">
              <path 
                d="M 6 42 Q 18 36 28 32 Q 40 20 48 10 Q 52 14 54 18 Q 62 14 66 18 Q 58 24 54 30 Q 56 36 68 44 Q 60 48 48 44 Q 38 46 32 54 L 22 56 Q 26 48 20 46 Z" 
                fill="url(#goldRing)" 
                stroke="#78350F" 
                strokeWidth="1.2" 
              />
              <path 
                d="M 6 42 Q -12 36 -18 20 Q -4 28 4 32 Q -8 18 2 12 Q 2 24 10 32 Z" 
                fill="url(#goldRing)" 
                stroke="#78350F" 
                strokeWidth="1" 
              />
              <path d="M -12 20 Q -4 28 2 26 Z" fill="#991B1B" />
            </g>
          </g>
        </svg>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('config');
      const [userRole, setUserRole] = useState('editor');
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);
      const [copiedLinkType, setCopiedLinkType] = useState(null);
      const [customLogoUrl, setCustomLogoUrl] = useState(null);
      const [cloudStatus, setCloudStatus] = useState('offline'); // 'offline' | 'connecting' | 'connected' | 'error'
      const [cloudErrorMsg, setCloudErrorMsg] = useState('');
      const [firebaseCustomConfig, setFirebaseCustomConfig] = useState(null);
      const [firebaseModalOpen, setFirebaseModalOpen] = useState(false);
      const [firebaseConfigInput, setFirebaseConfigInput] = useState('');

      const [config, setConfig] = useState({
        name: 'Tournoi du CS La Verpillière',
        format: 'groups_knockout',
        duration: 20,
        breakDuration: 10,
        startTime: '09:00',
        hasLunchBreak: true,
        lunchStart: '12:30',
        lunchEnd: '13:30',
        pointsWin: 3,
        pointsDraw: 1,
        pointsLoss: 0,
        qualifiersPerGroup: 2
      });

      const [fields, setFields] = useState(DEFAULT_FIELDS);
      const [newFieldName, setNewFieldName] = useState('');
      const [scheduleViewMode, setScheduleViewMode] = useState('chrono');
      const [teams, setTeams] = useState(DEMO_TEAMS);
      const [newTeamName, setNewTeamName] = useState('');
      const [selectedColor, setSelectedColor] = useState(TEAM_COLORS[0]);
      const [editingTeam, setEditingTeam] = useState(null);
      const [newPlayerInputs, setNewPlayerInputs] = useState({});
      const [matches, setMatches] = useState([]);
      const [editingMatch, setEditingMatch] = useState(null);
      const [goalScorerName, setGoalScorerName] = useState('');
      const [goalTeamId, setGoalTeamId] = useState('');
      const [cardPlayerName, setCardPlayerName] = useState('');
      const [cardTeamId, setCardTeamId] = useState('');
      const [cardType, setCardType] = useState('yellow');
      const [notification, setNotification] = useState(null);
      const [qrCodeDataUrl, setQrCodeDataUrl] = useState('');
      const [selectedQrType, setSelectedQrType] = useState('viewer');
      const [showPosterModal, setShowPosterModal] = useState(false);

      // Charger depuis stockage local au démarrage & détecter la clé cloud dans l'URL
      useEffect(() => {
        try {
          const params = new URLSearchParams(window.location.search);

          // 1. Détection automatique et robuste de la configuration cloud dans le lien / QR code scanné
          const cloudParam = params.get('cloud');
          if (cloudParam) {
            try {
              let decoded = null;
              try {
                decoded = JSON.parse(decodeURIComponent(escape(atob(cloudParam))));
              } catch(e1) {
                decoded = JSON.parse(decodeURIComponent(cloudParam));
              }

              if (decoded && decoded.apiKey && decoded.projectId) {
                const completeConfig = {
                  apiKey: decoded.apiKey,
                  projectId: decoded.projectId,
                  authDomain: decoded.authDomain || `${decoded.projectId}.firebaseapp.com`,
                  appId: decoded.appId || `1:web:${decoded.projectId}`,
                  storageBucket: decoded.storageBucket || `${decoded.projectId}.firebasestorage.app`
                };
                setFirebaseCustomConfig(completeConfig);
                localStorage.setItem('cslv_fb_cfg', JSON.stringify(completeConfig));
                showToast("Connexion au direct en cours via le QR code...", "success");
              }
            } catch (err) {
              console.warn("Impossible de décoder le paramètre cloud de l'URL", err);
            }
          }

          const savedData = localStorage.getItem('cslv_tournament_data');
          if (savedData) {
            const parsed = JSON.parse(savedData);
            if (parsed.config) setConfig(parsed.config);
            if (parsed.fields) setFields(parsed.fields);
            if (parsed.teams) setTeams(parsed.teams);
            if (parsed.matches) setMatches(parsed.matches);
            if (parsed.customLogoUrl) setCustomLogoUrl(parsed.customLogoUrl);
          }
          const savedFb = localStorage.getItem('cslv_fb_cfg');
          if (savedFb && !cloudParam) {
            setFirebaseCustomConfig(JSON.parse(savedFb));
          }

          if (params.get('role') === 'viewer') {
            setUserRole('viewer');
            setActiveTab('matches');
          }
        } catch(e) {}
      }, []);

      // Synchronisation Cloud Fiable avec Firebase Compat
      useEffect(() => {
        let unsubscribe = null;
        let isMounted = true;

        const initCloud = async () => {
          if (!window.firebase) return;

          let cfg = null;
          if (typeof __firebase_config !== 'undefined') {
            try { cfg = JSON.parse(__firebase_config); } catch(e){}
          } else if (firebaseCustomConfig) {
            cfg = firebaseCustomConfig;
          }

          if (!cfg || !cfg.apiKey || !cfg.projectId) {
            if (isMounted) setCloudStatus('offline');
            return;
          }

          try {
            if (isMounted) {
              setCloudStatus('connecting');
              setCloudErrorMsg('');
            }

            // Initialiser Firebase de façon sécurisée (singleton)
            let app;
            const existingApps = window.firebase.apps;
            if (existingApps && existingApps.length > 0) {
              app = existingApps[0];
            } else {
              app = window.firebase.initializeApp(cfg);
            }

            const auth = app.auth();
            const db = app.firestore();
            const tournamentDocId = 'live_tournament_data';
            const docRef = db.collection('tournaments').doc(tournamentDocId);

            // 1. Authentification anonyme fiable
            try {
              if (!auth.currentUser) {
                await auth.signInAnonymously();
              }
            } catch (authErr) {
              console.warn("Auth anonyme non active ou rejetée :", authErr);
            }

            if (!isMounted) return;

            // 2. Écoute temps réel avec mise à jour immédiate
            unsubscribe = docRef.onSnapshot(
              (docSnap) => {
                if (!isMounted) return;
                if (docSnap && docSnap.exists) {
                  const cloudData = docSnap.data();
                  if (cloudData) {
                    if (cloudData.config) setConfig(cloudData.config);
                    if (cloudData.fields) setFields(cloudData.fields);
                    if (cloudData.teams) setTeams(cloudData.teams);
                    if (cloudData.matches) setMatches(cloudData.matches);
                    if (cloudData.customLogoUrl) setCustomLogoUrl(cloudData.customLogoUrl);
                  }
                } else if (userRole === 'editor') {
                  // Premier enregistrement si le document distant n'existe pas encore
                  const initialData = { config, fields, teams, matches, customLogoUrl, lastUpdate: Date.now() };
                  docRef.set(JSON.parse(JSON.stringify(initialData))).catch(()=>{});
                }
                setCloudStatus('connected');
                setCloudErrorMsg('');
              },
              (error) => {
                if (!isMounted) return;
                console.warn("Firestore Notice :", error.message);
                setCloudStatus('error');
                if (error.code === 'permission-denied' || (error.message && error.message.includes('permissions'))) {
                  setCloudErrorMsg("Règles Firestore verrouillées : activez 'allow read, write: if true;'");
                } else {
                  setCloudErrorMsg(error.message || "Erreur de connexion Firestore");
                }
              }
            );

          } catch (err) {
            if (!isMounted) return;
            console.warn("Échec d'initialisation Firebase :", err);
            setCloudStatus('error');
            setCloudErrorMsg(err.message || "Échec de connexion");
          }
        };

        initCloud();
        return () => {
          isMounted = false;
          if (unsubscribe) unsubscribe();
        };
      }, [firebaseCustomConfig, userRole]);

      const handleAddTeam = () => {
        if (!newTeamName.trim()) return;
        const newTeam = {
          id: `team-${Date.now()}`,
          name: newTeamName.trim(),
          color: selectedColor,
          players: []
        };
        setTeams([...teams, newTeam]);
        setNewTeamName('');
        showToast(`Équipe "${newTeam.name}" ajoutée !`);
      };

      const handleAddPlayerToTeam = (teamId, playerName) => {
        if (!playerName || !playerName.trim()) return;
        setTeams(teams.map(t => {
          if (t.id === teamId) {
            const currentPlayers = t.players || [];
            return { ...t, players: [...currentPlayers, playerName.trim()] };
          }
          return t;
        }));
        setNewPlayerInputs(prev => ({ ...prev, [teamId]: '' }));
        showToast(`Joueur "${playerName.trim()}" ajouté !`);
      };

      const handleRemovePlayerFromTeam = (teamId, playerIndex) => {
        setTeams(teams.map(t => {
          if (t.id === teamId) {
            const updatedPlayers = (t.players || []).filter((_, i) => i !== playerIndex);
            return { ...t, players: updatedPlayers };
          }
          return t;
        }));
        showToast('Joueur retiré');
      };

      // Sauvegarde automatique (Locale + Cloud) à chaque modification
      useEffect(() => {
        try {
          const rawSave = { config, fields, teams, matches, customLogoUrl, lastUpdate: Date.now() };
          const sanitizedSave = JSON.parse(JSON.stringify(rawSave));
          localStorage.setItem('cslv_tournament_data', JSON.stringify(sanitizedSave));

          // Si connecté au Cloud et en mode organisateur, pousser immédiatement dans Firestore
          if (cloudStatus === 'connected' && userRole === 'editor' && window.firebase && window.firebase.apps.length > 0) {
            let cfg = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseCustomConfig;
            if (cfg) {
              const db = window.firebase.firestore();
              const tournamentDocId = 'live_tournament_data';
              const docRef = db.collection('tournaments').doc(tournamentDocId);
              docRef.set(sanitizedSave, { merge: true })
                .catch((e) => {
                  console.warn("Écriture cloud échouée:", e);
                });
            }
          }
        } catch(e) {
          console.error("Erreur de sauvegarde :", e);
        }
      }, [config, fields, teams, matches, customLogoUrl, userRole, cloudStatus]);

      const showToast = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 3000);
      };

      const timeToMinutes = (timeStr) => {
        if (!timeStr) return 0;
        const [h, m] = timeStr.split(':').map(Number);
        return (h || 0) * 60 + (m || 0);
      };

      const minutesToTime = (totalMinutes) => {
        const mins = Math.max(0, Math.floor(totalMinutes));
        const h = Math.floor(mins / 60) % 24;
        const m = mins % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      };

      const generateSchedule = () => {
        if (teams.length < 2) {
          showToast('Il faut au moins 2 équipes !', 'error');
          return;
        }
        if (fields.length === 0) {
          showToast('Ajoutez au moins 1 terrain !', 'error');
          return;
        }

        let rawMatches = [];

        if (config.format === 'round_robin') {
          rawMatches = generateRoundRobin(teams, 'Poule Unique');
        } else if (config.format === 'groups_knockout') {
          if (teams.length < 4) {
            showToast('Au moins 4 équipes nécessaires', 'error');
            return;
          }
          const half = Math.ceil(teams.length / 2);
          const groupA = teams.slice(0, half);
          const groupB = teams.slice(half);

          const matchesA = generateRoundRobin(groupA, 'Poule A');
          const matchesB = generateRoundRobin(groupB, 'Poule B');

          const interleaved = [];
          const maxLen = Math.max(matchesA.length, matchesB.length);
          for (let i = 0; i < maxLen; i++) {
            if (matchesA[i]) interleaved.push(matchesA[i]);
            if (matchesB[i]) interleaved.push(matchesB[i]);
          }

          const semi1 = {
            id: 'ko-semi-1', stage: 'Demi-Finale 1', group: 'Phase Finale',
            team1Id: null, team2Id: null, placeholder1: '1er Poule A', placeholder2: '2ème Poule B',
            score1: null, score2: null, pens1: null, pens2: null, status: 'pending', round: 99, events: []
          };
          const semi2 = {
            id: 'ko-semi-2', stage: 'Demi-Finale 2', group: 'Phase Finale',
            team1Id: null, team2Id: null, placeholder1: '1er Poule B', placeholder2: '2ème Poule A',
            score1: null, score2: null, pens1: null, pens2: null, status: 'pending', round: 99, events: []
          };
          const finalMatch = {
            id: 'ko-final', stage: 'Grande Finale', group: 'Phase Finale',
            team1Id: null, team2Id: null, placeholder1: 'Vainqueur Demi 1', placeholder2: 'Vainqueur Demi 2',
            score1: null, score2: null, pens1: null, pens2: null, status: 'pending', round: 100, events: []
          };

          rawMatches = [...interleaved, semi1, semi2, finalMatch];
        }

        const scheduled = scheduleMatchesAcrossFields(rawMatches);
        setMatches(scheduled);
        showToast(`Planning généré : ${scheduled.length} matchs sur ${fields.length} terrain(s) !`);
        setActiveTab('matches');
      };

      const scheduleMatchesAcrossFields = (matchList) => {
        const matchDur = parseInt(config.duration, 10) || 20;
        const breakDur = parseInt(config.breakDuration, 10) || 10;
        const tourneyStartMin = timeToMinutes(config.startTime || '09:00');
        const lunchStartMin = config.hasLunchBreak ? timeToMinutes(config.lunchStart || '12:30') : -1;
        const lunchEndMin = config.hasLunchBreak ? timeToMinutes(config.lunchEnd || '13:30') : -1;

        const fieldAvailability = fields.map(f => ({
          fieldId: f.id,
          fieldName: f.name,
          nextAvailableMin: tourneyStartMin
        }));

        return matchList.map(match => {
          fieldAvailability.sort((a, b) => a.nextAvailableMin - b.nextAvailableMin);
          const chosenField = fieldAvailability[0];

          let startMin = chosenField.nextAvailableMin;
          if (config.hasLunchBreak && startMin < lunchEndMin && (startMin + matchDur) > lunchStartMin) {
            startMin = Math.max(startMin, lunchEndMin);
          }

          const endMin = startMin + matchDur;
          chosenField.nextAvailableMin = endMin + breakDur;

          return {
            ...match,
            fieldId: chosenField.fieldId,
            fieldName: chosenField.fieldName,
            startTime: minutesToTime(startMin),
            endTime: minutesToTime(endMin)
          };
        });
      };

      const generateRoundRobin = (teamList, groupName) => {
        let t = [...teamList];
        if (t.length % 2 !== 0) t.push({ id: 'bye', name: 'Exempt', isBye: true });
        const n = t.length;
        const rounds = n - 1;
        const matchesPerRound = n / 2;
        const generated = [];

        for (let round = 0; round < rounds; round++) {
          for (let match = 0; match < matchesPerRound; match++) {
            const home = (round + match) % (n - 1);
            let away = (n - 1 - match + round) % (n - 1);
            if (match === 0) away = n - 1;

            const homeTeam = t[home];
            const awayTeam = t[away];

            if (!homeTeam.isBye && !awayTeam.isBye) {
              generated.push({
                id: `m-${groupName}-${round + 1}-${homeTeam.id}-${awayTeam.id}`,
                group: groupName,
                stage: `Journée ${round + 1}`,
                team1Id: homeTeam.id,
                team2Id: awayTeam.id,
                score1: null,
                score2: null,
                status: 'pending',
                events: [],
                round: round + 1
              });
            }
          }
        }
        return generated;
      };

      const calculateStandings = (groupFilter = null) => {
        const table = {};
        teams.forEach(t => {
          table[t.id] = { team: t, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, gd: 0, points: 0, form: [] };
        });

        matches.forEach(m => {
          if (m.status === 'finished' && m.team1Id && m.team2Id) {
            if (groupFilter && m.group !== groupFilter) return;

            const s1 = Number(m.score1 ?? 0);
            const s2 = Number(m.score2 ?? 0);
            const t1 = table[m.team1Id];
            const t2 = table[m.team2Id];

            if (t1 && t2) {
              t1.played += 1; t2.played += 1;
              t1.gf += s1; t1.ga += s2;
              t2.gf += s2; t2.ga += s1;

              if (s1 > s2) {
                t1.won += 1; t1.points += config.pointsWin; t1.form.push('W');
                t2.lost += 1; t2.points += config.pointsLoss; t2.form.push('L');
              } else if (s1 < s2) {
                t2.won += 1; t2.points += config.pointsWin; t2.form.push('W');
                t1.lost += 1; t1.points += config.pointsLoss; t1.form.push('L');
              } else {
                t1.drawn += 1; t2.drawn += 1;
                t1.points += config.pointsDraw; t2.points += config.pointsDraw;
                t1.form.push('D'); t2.form.push('D');
              }
              t1.gd = t1.gf - t1.ga;
              t2.gd = t2.gf - t2.ga;
            }
          }
        });

        const result = Object.values(table);
        const activeInGroup = groupFilter 
          ? result.filter(row => matches.some(m => m.group === groupFilter && (m.team1Id === row.team.id || m.team2Id === row.team.id)))
          : result;

        return activeInGroup.sort((a, b) => b.points !== a.points ? b.points - a.points : b.gd !== a.gd ? b.gd - a.gd : b.gf - a.gf);
      };

      const updateKnockoutProgression = (updatedMatches) => {
        let newM = [...updatedMatches];
        if (config.format === 'groups_knockout') {
          const standingsA = calculateStandings('Poule A');
          const standingsB = calculateStandings('Poule B');
          const allFinishedA = newM.filter(m => m.group === 'Poule A').every(m => m.status === 'finished');
          const allFinishedB = newM.filter(m => m.group === 'Poule B').every(m => m.status === 'finished');

          if (allFinishedA && standingsA.length >= 2) {
            newM = newM.map(m => {
              if (m.id === 'ko-semi-1') return { ...m, team1Id: standingsA[0].team.id };
              if (m.id === 'ko-semi-2') return { ...m, team2Id: standingsA[1].team.id };
              return m;
            });
          }
          if (allFinishedB && standingsB.length >= 2) {
            newM = newM.map(m => {
              if (m.id === 'ko-semi-2') return { ...m, team1Id: standingsB[0].team.id };
              if (m.id === 'ko-semi-1') return { ...m, team2Id: standingsB[1].team.id };
              return m;
            });
          }

          const semi1 = newM.find(m => m.id === 'ko-semi-1');
          const semi2 = newM.find(m => m.id === 'ko-semi-2');
          const getWinner = (m) => {
            if (!m || m.status !== 'finished') return null;
            if (m.score1 > m.score2) return m.team1Id;
            if (m.score2 > m.score1) return m.team2Id;
            if ((m.pens1 || 0) > (m.pens2 || 0)) return m.team1Id;
            return m.team2Id;
          };
          const w1 = getWinner(semi1);
          const w2 = getWinner(semi2);

          newM = newM.map(m => {
            if (m.id === 'ko-final') return { ...m, team1Id: w1 || m.team1Id, team2Id: w2 || m.team2Id };
            return m;
          });
        }
        return newM;
      };

      const getTeam = (id) => teams.find(t => t.id === id) || { name: 'Équipe inconnue', color: '#64748B' };

      const exportTournamentJSON = () => {
        const data = { config, fields, teams, matches, customLogoUrl };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Tournoi_CS_La_Verpilliere.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Fichier du tournoi exporté !');
      };

      const importTournamentJSON = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const imported = JSON.parse(e.target.result);
            if (imported.config) setConfig(imported.config);
            if (imported.fields) setFields(imported.fields);
            if (imported.teams) setTeams(imported.teams);
            if (imported.matches) setMatches(imported.matches);
            if (imported.customLogoUrl) setCustomLogoUrl(imported.customLogoUrl);
            showToast('Tournoi restauré avec succès !');
          } catch {
            showToast('Fichier JSON invalide', 'error');
          }
        };
        reader.readAsText(file);
      };

      const copyShareLink = (role) => {
        const url = getFullShareUrl(role);
        navigator.clipboard?.writeText(url).then(() => {
          setCopiedLinkType(role);
          showToast(`Lien ${role === 'viewer' ? 'Public' : 'Organisateur'} copié !`);
          setTimeout(() => setCopiedLinkType(null), 2000);
        });
      };

      // Construit un lien qui embarque la clé cloud pour que les téléphones se connectent sans rien configurer
      const getFullShareUrl = (role) => {
        // Obtenir l'URL de base propre
        const currentUrl = new URL(window.location.href);
        currentUrl.search = '';
        currentUrl.searchParams.set('role', role);

        if (!firebaseCustomConfig) return currentUrl.toString();

        try {
          // Embarquer les clés complètes nécessaires à Firebase pour que la connexion fonctionne à 100%
          const cloudConfig = {
            apiKey: firebaseCustomConfig.apiKey,
            projectId: firebaseCustomConfig.projectId,
            authDomain: firebaseCustomConfig.authDomain || `${firebaseCustomConfig.projectId}.firebaseapp.com`,
            appId: firebaseCustomConfig.appId || `1:web:${firebaseCustomConfig.projectId}`
          };
          const jsonStr = JSON.stringify(cloudConfig);
          const cloudParam = btoa(unescape(encodeURIComponent(jsonStr)));
          currentUrl.searchParams.set('cloud', cloudParam);
          return currentUrl.toString();
        } catch {
          return currentUrl.toString();
        }
      };

      // Générer le QR Code proprement dès l'ouverture de la modale ou le changement de type
      useEffect(() => {
        if (!isShareModalOpen && !showPosterModal) return;

        const targetUrl = getFullShareUrl(userRole === 'editor' ? selectedQrType : 'viewer');

        // Utiliser une passerelle haute résolution directe infaillible pour le scan smartphone
        const quickChartUrl = `https://quickchart.io/qr?text=${encodeURIComponent(targetUrl)}&size=300&margin=2&ecLevel=L`;
        setQrCodeDataUrl(quickChartUrl);

        // Essayer en parallèle le canvas local si supporté
        if (window.QRCode && window.QRCode.toDataURL) {
          window.QRCode.toDataURL(
            targetUrl,
            {
              width: 300,
              margin: 2,
              errorCorrectionLevel: 'L'
            },
            (err, url) => {
              if (!err && url) {
                setQrCodeDataUrl(url);
              }
            }
          );
        }
      }, [isShareModalOpen, selectedQrType, firebaseCustomConfig, showPosterModal, userRole]);

      const stats = useMemo(() => {
        const scorers = {};
        const fairplay = {};
        let totalGoals = 0;
        let totalCards = 0;

        teams.forEach(t => {
          fairplay[t.id] = { team: t, yellow: 0, red: 0, points: 0 };
        });

        matches.forEach(m => {
          if (m.events) {
            m.events.forEach(e => {
              if (e.type === 'goal') {
                totalGoals++;
                const key = `${e.player}__${e.teamId}`;
                if (!scorers[key]) scorers[key] = { player: e.player, teamId: e.teamId, count: 0 };
                scorers[key].count++;
              }
              if (e.type === 'yellow' || e.type === 'red') {
                totalCards++;
                if (fairplay[e.teamId]) {
                  if (e.type === 'yellow') { fairplay[e.teamId].yellow++; fairplay[e.teamId].points += 1; }
                  else { fairplay[e.teamId].red++; fairplay[e.teamId].points += 3; }
                }
              }
            });
          }
        });

        return {
          topScorers: Object.values(scorers).sort((a, b) => b.count - a.count).slice(0, 5),
          fairPlayRank: Object.values(fairplay).sort((a, b) => a.points - b.points),
          totalGoals,
          totalCards,
          completedMatches: matches.filter(m => m.status === 'finished').length,
          totalMatches: matches.length
        };
      }, [matches, teams]);

      return (
        <div className="min-h-screen bg-[#0e0708] text-slate-100 flex flex-col font-sans">
          {notification && (
            <div className={`fixed top-4 right-4 z-50 flex items-center gap-2 px-4 py-3 rounded-xl shadow-2xl border text-sm animate-bounce ${
              notification.type === 'error' ? 'bg-rose-950 border-rose-600 text-rose-200' : 'bg-red-950 border-amber-500 text-amber-200'

                    {/* Indicateur Cloud avec interaction d'aide en cas d'erreur */}

                      className={`text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1.5 transition cursor-pointer ${
                        cloudStatus === 'connected' 
                          ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/30' 
                          : cloudStatus === 'error'
                          ? 'bg-rose-500/20 text-rose-300 border border-rose-500/40 hover:bg-rose-500/30 animate-pulse'
                          : cloudStatus === 'connecting'
                          ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30'
                          : 'bg-zinc-800 text-zinc-400 hover:text-white'

                      title={cloudErrorMsg || "Statut de synchronisation"}
                    >
                      <span className={`w-1.5 h-1.5 rounded-full ${
                        cloudStatus === 'connected' ? 'bg-emerald-400' : 
                        cloudStatus === 'error' ? 'bg-rose-400' :
                        cloudStatus === 'connecting' ? 'bg-amber-400 animate-ping' : 'bg-zinc-500'
                      }`}></span>
                      {cloudStatus === 'connected' ? 'En direct (Cloud)' : 
                       cloudStatus === 'error' ? 'Accès Firestore à autoriser (cliquez)' :
                       cloudStatus === 'connecting' ? 'Connexion...' : 'Local'}
                    </button>
                  </div>
                  <div className="text-xs font-semibold text-amber-400">CS La Verpillière &bull; Sang et Or 1939</div>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <button
                  onClick={() => {
                    const next = userRole === 'editor' ? 'viewer' : 'editor';
                    setUserRole(next);
                    if (next === 'viewer') setActiveTab('matches');
                  }}
                  className="px-3 py-1.5 rounded-lg border text-xs font-semibold border-amber-600/40 bg-amber-950/40 text-amber-300 hover:bg-amber-900/50 transition"
                >
                  {userRole === 'editor' ? '👁 Mode Public' : '🔒 Mode Organisateur'}
                </button>

                <button
                  onClick={() => setIsShareModalOpen(true)}
                  className="px-3.5 py-1.5 rounded-lg bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-black text-xs transition shadow-lg"
                >
                  Partager
                </button>
              </div>
            </div>

            {/* Onglets */}
            <div className="max-w-7xl mx-auto px-4 flex space-x-2 overflow-x-auto py-2 no-scrollbar border-t border-red-950 bg-black/20">
              {userRole === 'editor' && (
                <button
                  onClick={() => setActiveTab('config')}
                  className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                    activeTab === 'config' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40' : 'text-zinc-400 hover:text-white'
                  }`}
                >
                  ⚙ Configuration & Terrains
                </button>
              )}
              <button
                onClick={() => setActiveTab('teams')}
                className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                  activeTab === 'teams' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40' : 'text-zinc-400 hover:text-white'
                }`}
              >
                👥 Équipes ({teams.length})
              </button>
              <button
                onClick={() => setActiveTab('matches')}
                className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                  activeTab === 'matches' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40' : 'text-zinc-400 hover:text-white'
                }`}
              >
                📅 Matchs ({matches.length})
              </button>
              <button
                onClick={() => setActiveTab('standings')}
                className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                  activeTab === 'standings' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40' : 'text-zinc-400 hover:text-white'
                }`}
              >
                📊 Classement
              </button>
              {config.format !== 'round_robin' && (
                <button
                  onClick={() => setActiveTab('bracket')}
                  className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                    activeTab === 'bracket' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40' : 'text-zinc-400 hover:text-white'
                  }`}
                >
                  🏆 Phase Finale
                </button>
              )}
              <button
                onClick={() => setActiveTab('stats')}
                className={`px-3.5 py-2 rounded-xl text-xs font-bold transition whitespace-nowrap ${
                  activeTab === 'stats' ? 'bg-gradient-to-r from-red-900 to-red-800 text-amber-300 border border-amber-500/40' : 'text-zinc-400 hover:text-white'
                }`}
              >
                🔥 Statistiques
              </button>
            </div>
          </header>

          <main className="flex-1 max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-6">
            {/* Bannière d'alerte explicative si Firestore renvoie 'Missing permissions' */}
            {cloudStatus === 'error' && (
              <div className="mb-4 bg-rose-950/70 border border-rose-700/80 rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-xs text-rose-200">
                <div className="flex items-center gap-2.5">
                  <span className="text-lg">🔒</span>
                  <div>
                    <strong className="text-white block font-semibold">Base de données en attente d'autorisation (Firebase Rules)</strong>
                    <span>Vos données locales sont sécurisées. Pour activer la synchronisation live, autorisez l'accès dans votre console Firebase.</span>
                  </div>
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  <button
                    onClick={() => {
                      const rulesText = "rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /{document=**} {\n      allow read, write: if true;\n    }\n  }\n}";
                      if (navigator.clipboard) {
                        navigator.clipboard.writeText(rulesText);
                        showToast("Règles copiées dans le presse-papier !");
                      }
                    }}
                    className="px-3 py-1.5 bg-[#25090d] hover:bg-[#3d0f15] text-amber-300 border border-amber-500/40 rounded-lg font-bold"
                  >
                    📋 Copier la règle
                  </button>
                  <button
                    onClick={() => setFirebaseModalOpen(true)}
                    className="px-3 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-black rounded-lg"
                  >
                    Voir l'aide
                  </button>
                </div>
              </div>
            )}

            {/* CONFIGURATION */}
            {activeTab === 'config' && userRole === 'editor' && (
              <div className="space-y-6">
                <div className="bg-[#150709] border border-red-950 rounded-2xl p-6 shadow-xl">
                  <h2 className="text-lg font-bold text-white mb-4">Paramètres du Tournoi</h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Nom du Tournoi</label>
                      <input
                        type="text"
                        value={config.name}
                        onChange={(e) => setConfig({ ...config, name: e.target.value })}
                        className="w-full bg-[#0a0304] border border-red-900/60 rounded-xl px-4 py-2.5 text-white"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 uppercase mb-1">Format</label>
                      <select
                        value={config.format}
                        onChange={(e) => setConfig({ ...config, format: e.target.value })}
                        className="w-full bg-[#0a0304] border border-red-900/60 rounded-xl px-4 py-2.5 text-white"
                      >
                        <option value="groups_knockout">Poules (A & B) + Phase Finale</option>
                        <option value="round_robin">Championnat direct (Poule unique)</option>
                      </select>
                    </div>
                  </div>

                  {/* HORAIRES & PAUSES */}
                  <h3 className="text-base font-bold text-white mb-3 pt-4 border-t border-red-950">Horaires & Pauses</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    <div className="bg-[#0b0304] p-3 rounded-xl border border-red-950">
                      <label className="block text-xs text-slate-400 mb-1">Coup d'envoi</label>
                      <input
                        type="time"
                        value={config.startTime}
                        onChange={(e) => setConfig({ ...config, startTime: e.target.value })}
                        className="w-full bg-[#18080a] border border-red-900/60 rounded-lg p-2 text-white font-mono"
                      />
                    </div>
                    <div className="bg-[#0b0304] p-3 rounded-xl border border-red-950">
                      <label className="block text-xs text-slate-400 mb-1">Durée du match (min)</label>
                      <input
                        type="number"
                        value={config.duration}
                        onChange={(e) => setConfig({ ...config, duration: parseInt(e.target.value) || 20 })}
                        className="w-full bg-[#18080a] border border-red-900/60 rounded-lg p-2 text-white font-mono"
                      />
                    </div>
                    <div className="bg-[#0b0304] p-3 rounded-xl border border-red-950">
                      <label className="block text-xs text-slate-400 mb-1">Pause entre matchs (min)</label>
                      <input
                        type="number"
                        value={config.breakDuration}
                        onChange={(e) => setConfig({ ...config, breakDuration: parseInt(e.target.value) || 10 })}
                        className="w-full bg-[#18080a] border border-red-900/60 rounded-lg p-2 text-white font-mono"
                      />
                    </div>
                    <div className="bg-[#0b0304] p-3 rounded-xl border border-red-950">
                      <div className="flex justify-between items-center mb-1">
                        <label className="text-xs text-slate-400">Pause Déjeuner</label>
                        <input
                          type="checkbox"
                          checked={config.hasLunchBreak}
                          onChange={(e) => setConfig({ ...config, hasLunchBreak: e.target.checked })}
                          className="accent-amber-500"
                        />
                      </div>
                      {config.hasLunchBreak && (
                        <div className="flex gap-2">
                          <input
                            type="time"
                            value={config.lunchStart}
                            onChange={(e) => setConfig({ ...config, lunchStart: e.target.value })}
                            className="w-1/2 bg-[#18080a] border border-red-900/60 rounded-lg p-1.5 text-xs text-white font-mono"
                          />
                          <input
                            type="time"
                            value={config.lunchEnd}
                            onChange={(e) => setConfig({ ...config, lunchEnd: e.target.value })}
                            className="w-1/2 bg-[#18080a] border border-red-900/60 rounded-lg p-1.5 text-xs text-white font-mono"
                          />
                        </div>
                      )}
                    </div>
                  </div>

                  {/* GESTION DES TERRAINS */}
                  <h3 className="text-base font-bold text-white mb-3 pt-4 border-t border-red-950">Gestion des Terrains</h3>
                  <div className="flex gap-2 mb-4">
                    <input
                      type="text"
                      placeholder="Nom du terrain (ex: Terrain Honneur, Futsal...)"
                      value={newFieldName}
                      onChange={(e) => setNewFieldName(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && newFieldName.trim()) {
                          setFields([...fields, { id: `field-${Date.now()}`, name: newFieldName.trim() }]);
                          setNewFieldName('');
                          showToast('Terrain ajouté !');
                        }
                      }}
                      className="flex-1 bg-[#0b0304] border border-red-900/60 rounded-xl px-3 py-2 text-white text-xs"
                    />
                    <button
                      onClick={() => {
                        if (newFieldName.trim()) {
                          setFields([...fields, { id: `field-${Date.now()}`, name: newFieldName.trim() }]);
                          setNewFieldName('');
                          showToast('Terrain ajouté !');
                        }
                      }}
                      className="px-4 py-2 bg-gradient-to-r from-red-900 to-red-800 text-amber-300 rounded-xl font-bold text-xs border border-amber-500/30"
                    >
                      + Ajouter
                    </button>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-6">
                    {fields.map(f => (
                      <div key={f.id} className="bg-[#0b0304] border border-red-950 rounded-xl p-3 flex justify-between items-center">
                        <span className="text-sm font-semibold text-white">{f.name}</span>

                  <div className="flex items-center gap-2">
                    <span className="text-xl">⚡</span>
                    <h3 className="font-bold text-white text-base">Connexion Firebase Cloud (Gratuit)</h3>
                  </div>
                  <button onClick={() => setFirebaseModalOpen(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                {cloudStatus === 'error' && (
                  <div className="mb-3 p-3 bg-rose-950/80 border border-rose-700 rounded-xl text-rose-200 text-xs space-y-2">
                    <div>
                      <strong>⚠️ Action requise sur Firebase Console :</strong> {cloudErrorMsg}
                    </div>
                    <div className="bg-black/60 p-2.5 rounded-lg border border-rose-900 font-mono text-[11px] text-amber-200">
                      rules_version = '2';<br/>
                      service cloud.firestore &#123;<br/>
                      &nbsp;&nbsp;match /databases/&#123;database&#125;/documents &#123;<br/>
                      &nbsp;&nbsp;&nbsp;&nbsp;match /&#123;document=**&#125; &#123;<br/>
                      &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;allow read, write: if true;<br/>
                      &nbsp;&nbsp;&nbsp;&nbsp;&#125;<br/>
                      &nbsp;&nbsp;&#125;<br/>
                      &#125;
                    </div>
                    <p className="text-[11px] text-slate-300">
                      Rendez-vous sur <strong>Firebase &gt; Cloud Firestore &gt; onglet Règles</strong>, collez ce bloc et cliquez sur le bouton bleu <strong>Publier</strong> (Publish).
                    </p>
                  </div>
                )}

                <div className="space-y-4 text-xs text-slate-300">
                  <div className="bg-[#0b0304] p-3 rounded-xl border border-red-950 space-y-2">
                    <p className="font-bold text-amber-300 text-xs">Rappels indispensables :</p>
                    <ol className="list-decimal list-inside space-y-1 text-slate-400 text-[11px]">
                      <li>Dans <strong className="text-white">Cloud Firestore &gt; Règles</strong> : vérifier que <code className="text-amber-300">allow read, write: if true;</code> est présent.</li>
                      <li>Dans <strong className="text-white">Authentication &gt; Sign-in method</strong> : vérifier que <strong className="text-amber-400">Anonyme</strong> est activé.</li>
                    </ol>
                  </div>

                  <div>
                    <label className="block text-slate-300 font-bold mb-1">Collez le code fourni par Firebase :</label>
                    <textarea
                      rows={5}
                      value={firebaseConfigInput}
                      onChange={(e) => setFirebaseConfigInput(e.target.value)}
                      placeholder={'const firebaseConfig = {\n  apiKey: "AIzaSy...",\n  projectId: "mon-projet",\n  ...\n};'}
                      className="w-full bg-[#0b0304] border border-red-900 rounded-xl p-3 font-mono text-xs text-amber-200 focus:outline-none focus:border-amber-400"
                    />
                    <div className="flex justify-between items-center mt-1 text-[11px] text-slate-400">
                      <span>Accepte le texte JavaScript brut ou le format JSON.</span>
                      <button
                        type="button"
                        onClick={async () => {
                          try {
                            const text = await navigator.clipboard.readText();
                            if (text) {
                              setFirebaseConfigInput(text);
                              showToast("Texte collé depuis le presse-papier !");
                            }
                          } catch {
                            showToast("Cliquez dans la case et appuyez sur CTRL+V", "error");
                          }
                        }}
                        className="text-amber-400 hover:text-amber-300 underline font-semibold cursor-pointer"
                      >
                        📋 Coller le presse-papier
                      </button>
                    </div>
                  </div>

                  <div className="flex gap-2 justify-end pt-2 border-t border-red-950">
                    <button
                      type="button"
                      onClick={() => setFirebaseModalOpen(false)}
                      className="px-4 py-2 text-slate-400 hover:text-white"
                    >
                      Annuler
                    </button>
                    {firebaseCustomConfig && (
                      <button
                        type="button"
                        onClick={() => {
                          localStorage.removeItem('cslv_fb_cfg');
                          setFirebaseCustomConfig(null);
                          setCloudStatus('offline');
                          setFirebaseModalOpen(false);
                          showToast("Mode hors-ligne activé");
                        }}
                        className="px-3 py-2 bg-rose-950 text-rose-300 border border-rose-800 rounded-xl font-bold"
                      >
                        Désactiver
                      </button>
                    )}
                    <button
                      type="button"
                      onClick={() => {
                        try {
                          const raw = (firebaseConfigInput || '').trim();
                          if (!raw) {
                            showToast("Veuillez d'abord coller le code Firebase !", "error");
                            return;
                          }

                          // Extraction universelle insensible aux guillemets, virgules ou espacements
                          const extractKey = (keyName) => {
                            const patterns = [
                              new RegExp(`["']?${keyName}["']?\\s*:\\s*["'\`]([^"'\`]+)["'\`]`, 'i'),
                              new RegExp(`${keyName}\\s*=\\s*["'\`]([^"'\`]+)["'\`]`, 'i')
                            ];
                            for (const pat of patterns) {
                              const match = raw.match(pat);
                              if (match && match[1]) return match[1].trim();
                            }
                            return null;
                          };

                          let apiKey = extractKey('apiKey');
                          let projectId = extractKey('projectId');
                          let authDomain = extractKey('authDomain');
                          let storageBucket = extractKey('storageBucket');
                          let messagingSenderId = extractKey('messagingSenderId');
                          let appId = extractKey('appId');

                          // Si la regex n'a rien trouvé, tentons une lecture JSON directe
                          if (!apiKey || !projectId) {
                            const start = raw.indexOf('{');
                            const end = raw.lastIndexOf('}');
                            if (start !== -1 && end !== -1) {
                              try {
                                const parsed = JSON.parse(raw.substring(start, end + 1));
                                apiKey = apiKey || parsed.apiKey;
                                projectId = projectId || parsed.projectId;
                                authDomain = authDomain || parsed.authDomain;
                                storageBucket = storageBucket || parsed.storageBucket;
                                messagingSenderId = messagingSenderId || parsed.messagingSenderId;
                                appId = appId || parsed.appId;
                              } catch(e) {}
                            }
                          }

                          if (!apiKey || !projectId) {
                            showToast("Impossible de trouver apiKey ou projectId dans le texte collé.", "error");
                            return;
                          }

                          const configObj = {
                            apiKey,
                            projectId,
                            authDomain: authDomain || `${projectId}.firebaseapp.com`,
                            storageBucket: storageBucket || `${projectId}.firebasestorage.app`,
                            messagingSenderId: messagingSenderId || '',
                            appId: appId || ''
                          };

                          localStorage.setItem('cslv_fb_cfg', JSON.stringify(configObj));
                          setFirebaseCustomConfig(configObj);
                          setFirebaseModalOpen(false);
                          showToast("Paramètres enregistrés ! Connexion en cours...");
                        } catch (err) {
                          console.error(err);
                          showToast("Erreur lors de l'analyse du texte collé", "error");
                        }
                      }}
                      className="px-5 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-black rounded-xl cursor-pointer"
                    >
                      Enregistrer & Tester
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
