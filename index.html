    // Planification des poules : 8 à 32 équipes, uniquement 4 ou 5 par poule.
    const getPoolSizes = (n) => {
      if (n < 8 || n > 32 || n % 2 !== 0) return null;
      const count = Math.floor(n / 4);
      if (n > 5 * count) return null;
      return Array.from({ length: count }, (_, i) => 4 + (i < n - 4 * count ? 1 : 0));
    };
    const alphabetPoolName = i => `Poule ${String.fromCharCode(65 + i)}`;

    // Le classement utilise l'affectation ACTUELLE des équipes, mais conserve
    // leurs résultats passés, même si les rencontres furent jouées dans une autre poule.
    // Chaque rencontre est comptée une seule fois PAR équipe : aucun doublon.
    const standingsFor = (teamList, fixtureList, group, rules) => {
      const members = teamList.filter(t => (t.group || 'Poule A') === group);
      const rows = {};
      members.forEach(t => {
        rows[t.id] = { team: t, played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, gd: 0, points: 0, form: [] };
      });
      fixtureList.forEach(m => {
        // Les phases finales et les matchs de classement ne comptent pas en poule.
        if (!m.stage?.startsWith('Journée') || m.status !== 'finished' ||
            m.score1 == null || m.score2 == null) return;
        const x = Number(m.score1), y = Number(m.score2);
        if (!Number.isFinite(x) || !Number.isFinite(y)) return;
        const update = (teamId, scored, conceded) => {
          const r = rows[teamId];
          if (!r) return;
          r.played++; r.gf += scored; r.ga += conceded;
          if (scored > conceded) { r.won++; r.points += Number(rules.pointsWin ?? 3); r.form.push('W'); }
          else if (scored < conceded) { r.lost++; r.points += Number(rules.pointsLoss ?? 0); r.form.push('L'); }
          else { r.drawn++; r.points += Number(rules.pointsDraw ?? 1); r.form.push('D'); }
        };
        update(m.team1Id, x, y);
        update(m.team2Id, y, x);
      });
      return Object.values(rows).map(r => ({ ...r, gd: r.gf - r.ga }))
        .sort((a,b) => b.points - a.points || b.gd - a.gd || b.gf - a.gf || a.team.name.localeCompare(b.team.name, 'fr'));
    };

    // Résultat d'une rencontre avec prise en compte des tirs au but.
    const resultOf = m => {
      if (!m || m.status !== 'finished' || !m.team1Id || !m.team2Id ||
          m.score1 == null || m.score2 == null) return null;
      const a=Number(m.score1), b=Number(m.score2);
      if (!Number.isFinite(a) || !Number.isFinite(b)) return null;
      if (a > b) return { winner:m.team1Id, loser:m.team2Id };
      if (b > a) return { winner:m.team2Id, loser:m.team1Id };
      if (m.pens1 != null && m.pens2 != null && Number(m.pens1) !== Number(m.pens2))
        return Number(m.pens1) > Number(m.pens2)
          ? {winner:m.team1Id,loser:m.team2Id}
          : {winner:m.team2Id,loser:m.team1Id};
      return null;
    };

    const buildFinalStandings = (teamList, fixtureList, groupNames, rules) => {
      const groups = groupNames.map(g => standingsFor(teamList,fixtureList,g,rules));
      const byId = {};
      groups.forEach((standings,gi) => standings.forEach((s,i) => {
        byId[s.team.id] = { ...s, group:groupNames[gi], groupPosition:i+1,
          level:0, exact:null, description:'Classement de poule' };
      }));
      const knockout = fixtureList.filter(m => m.group === 'Phase Finale Principale');
      const classification = fixtureList.filter(m => ['Tournoi Classement','Tournoi Consolante'].includes(m.group));
      const hasPlayoffs = knockout.length > 0;
      if (hasPlayoffs) {
        // Niveau de progression (utile tant que le tournoi n'est pas terminé).
        knockout.forEach(m => {
          const rank = m.stage?.includes('Grande Finale') ? 5
            : m.stage?.includes('Demi-Finale') ? 4
            : m.stage?.includes('Quart') ? 3
            : m.stage?.includes('Huitième') ? 2 : 1;
          [m.team1Id,m.team2Id].forEach(id => {if (byId[id]) byId[id].level=Math.max(byId[id].level,rank);});
        });
        const final = knockout.find(m => m.id === 'ko-final' || m.stage === 'Grande Finale');
        const fg = resultOf(final);
        if (fg) {
          if (byId[fg.winner]) {byId[fg.winner].exact=1;byId[fg.winner].description='Champion';}
          if (byId[fg.loser]) {byId[fg.loser].exact=2;byId[fg.loser].description='Finaliste';}
        }
        const bronze = knockout.find(m => m.id === 'ko-bronze' || m.stage?.includes('3ème / 4ème'));
        const bg = resultOf(bronze);
        if (bg) {
          if (byId[bg.winner]) {byId[bg.winner].exact=3;byId[bg.winner].description='3e place';}
          if (byId[bg.loser]) {byId[bg.loser].exact=4;byId[bg.loser].description='4e place';}
        }
      }
      // Classements des non-qualifiés : mêmes rangs de poule, départagés par
      // les confrontations de classement jouées (sinon critères sportifs).
      const compareStats = (a,b) => b.points-a.points || b.gd-a.gd || b.gf-a.gf || a.team.name.localeCompare(b.team.name,'fr');
      const nonQualifiers = Object.values(byId).filter(r => !hasPlayoffs || r.groupPosition > Number(rules.qualifiersPerGroup ?? 2));
      const classificationStats = {};
      nonQualifiers.forEach(r => classificationStats[r.team.id]={points:0,gd:0,gf:0});
      classification.forEach(m => {
        const a=classificationStats[m.team1Id],b=classificationStats[m.team2Id];
        if (!a || !b || m.status !== 'finished' || m.score1 == null || m.score2 == null) return;
        const x=Number(m.score1),y=Number(m.score2);
        if(!Number.isFinite(x)||!Number.isFinite(y)) return;
        a.gf+=x; b.gf+=y; a.gd+=x-y; b.gd+=y-x;
        if(x>y) a.points+=3;
        else if(y>x) b.points+=3;
        else {
          const res=resultOf(m);
          if(res) classificationStats[res.winner].points+=3;
          else {a.points++;b.points++;}
        }
      });
      const cmpNon = (a,b) => a.groupPosition-b.groupPosition ||
        classificationStats[b.team.id].points-classificationStats[a.team.id].points ||
        classificationStats[b.team.id].gd-classificationStats[a.team.id].gd ||
        classificationStats[b.team.id].gf-classificationStats[a.team.id].gf || compareStats(a,b);
      nonQualifiers.sort(cmpNon);
      const qualified = Object.values(byId).filter(r => hasPlayoffs && r.groupPosition <= Number(rules.qualifiersPerGroup ?? 2));
      qualified.sort((a,b) => {
        if(a.exact!=null || b.exact!=null) return (a.exact??999)-(b.exact??999);
        return b.level-a.level || a.groupPosition-b.groupPosition || compareStats(a,b);
      });
      const ordered = hasPlayoffs ? [...qualified,...nonQualifiers] : nonQualifiers;
      // La position reste indicative jusqu'à la fin de toutes les rencontres.
      const relevant = fixtureList.filter(m=>m.stage?.startsWith('Journée') ||
        ['Phase Finale Principale','Tournoi Classement','Tournoi Consolante'].includes(m.group));
      const finished = relevant.length>0 && relevant.every(m=>m.status==='finished');
      return {rows:ordered.map((r,i)=>({...r,position:i+1})),finished};
    };

    const createTournamentPhases = (groupNames, poolSizes, playoffs, classification) => {
      const fixtures = [];
      const rank = (group, position) => ({ kind: 'rank', group, position });
      const winner = matchId => ({ kind: 'winner', matchId });
      const loser = matchId => ({ kind: 'loser', matchId });
      const fixture = (id, stage, group, source1, source2) => ({
        id, stage, group, source1, source2, team1Id: null, team2Id: null,
        placeholder1: source1?.kind === 'rank' ? `${source1.position+1}e ${source1.group}` : 'Vainqueur du tour précédent',
        placeholder2: source2?.kind === 'rank' ? `${source2.position+1}e ${source2.group}` : 'Vainqueur du tour précédent',
        score1: null, score2: null, pens1: null, pens2: null, status: 'pending', events: []
      });
      if (playoffs && groupNames.length === 2) {
        // Croisement officiel de deux poules : A1-B2 et B1-A2.
        // Le tableau est basé sur les rangs, pas sur l'ordre de saisie des équipes.
        const [a,b] = groupNames;
        fixtures.push(fixture('ko-semi-1','Demi-Finale 1','Phase Finale Principale',rank(a,0),rank(b,1)));
        fixtures.push(fixture('ko-semi-2','Demi-Finale 2','Phase Finale Principale',rank(b,0),rank(a,1)));
        fixtures.push(fixture('ko-final','Grande Finale','Phase Finale Principale',winner('ko-semi-1'),winner('ko-semi-2')));
        fixtures.push(fixture('ko-bronze','Match 3ème / 4ème place','Phase Finale Principale',loser('ko-semi-1'),loser('ko-semi-2')));
      } else if (playoffs) {
        const firsts = groupNames.map(g => rank(g,0));
        const seconds = groupNames.map(g => rank(g,1));
        const entrants = firsts.length + seconds.length;
        const bracketSize = 2 ** Math.ceil(Math.log2(entrants));
        const byes = bracketSize - entrants;
        // Exempts au premier tour : les premiers de poule, en priorité.
        const seeds = [...firsts, ...seconds];
        const exempt = seeds.slice(0,byes);
        const remaining = seeds.slice(byes);
        // Constituer des duels de poules distinctes si possible.
        const opening = [];
        while (remaining.length) {
          const a = remaining.shift();
          let j = remaining.findIndex(b => b.group !== a.group);
          if (j === -1) j = 0;
          const b = remaining.splice(j,1)[0];
          const id = `ko-r${Math.log2(bracketSize)}-${opening.length+1}`;
          fixtures.push(fixture(id, `${bracketSize === 4 ? 'Demi-Finale' : bracketSize === 8 ? 'Quart de Finale' : 'Huitième de Finale'} ${opening.length+1}`, 'Phase Finale Principale', a,b));
          opening.push(winner(id));
        }
        let advancing = [];
        // Répartir les exemptés et les vainqueurs dans le tableau restant.
        const sources = [...exempt, ...opening];
        const middle = Math.ceil(sources.length/2);
        for (let i=0;i<middle;i++) {
          if (sources[i]) advancing.push(sources[i]);
          if (sources[middle+i]) advancing.push(sources[middle+i]);
        }
        let roundSize = advancing.length;
        let roundIndex = 1;
        let semifinalIds = bracketSize === 4 ? opening.map(source => source.matchId) : [];
        while (roundSize >= 2) {
          const next = [];
          const stage = roundSize === 2 ? 'Grande Finale' : roundSize === 4 ? 'Demi-Finale' : roundSize === 8 ? 'Quart de Finale' : 'Huitième de Finale';
          semifinalIds = roundSize === 4 ? [] : semifinalIds;
          for(let i=0;i<advancing.length;i+=2) {
            const id = roundSize === 2 ? 'ko-final' : roundSize === 4 ? `ko-semi-${i/2+1}` : `ko-round-${roundIndex}-${i/2+1}`;
            fixtures.push(fixture(id, roundSize === 2 ? stage : `${stage} ${i/2+1}`, 'Phase Finale Principale', advancing[i], advancing[i+1]));
            if (roundSize === 4) semifinalIds.push(id);
            next.push(winner(id));
          }
          advancing = next;
          roundSize = advancing.length;
          roundIndex++;
        }
        if (semifinalIds.length === 2) fixtures.push(fixture('ko-bronze','Match 3ème / 4ème place','Phase Finale Principale',loser(semifinalIds[0]),loser(semifinalIds[1])));
      }
      if (classification) {
        // Confrontations de classement entre clubs de même rang, jamais de la même poule.
        for(let place=2;place<Math.max(...poolSizes);place++) {
          const groups = groupNames.filter((g,i) => poolSizes[i] > place);
          // Pour un nombre impair de poules, les trois dernières équipes
          // jouent un mini-championnat de classement (aucun exempt).
          const pairs = groups.length % 2 ? groups.length - 3 : groups.length;
          for(let i=0;i<pairs;i+=2) {
            fixtures.push(fixture(`rank-${place+1}-${i/2+1}`, `Classement ${place+1}e de poule — ${groups[i]} / ${groups[i+1]}`,
              'Tournoi Classement',rank(groups[i],place),rank(groups[i+1],place)));
          }
          if (groups.length % 2 && groups.length >= 3) {
            const trio=groups.slice(-3);
            [[0,1],[0,2],[1,2]].forEach(([a,b],i)=>fixtures.push(
              fixture(`rank-${place+1}-tri-${i+1}`,`Classement ${place+1}e de poule — ${trio[a]} / ${trio[b]}`,
                'Tournoi Classement',rank(trio[a],place),rank(trio[b],place))
            ));
          }
        }
      }
      return fixtures;
    };

    function App() {

      const [config, setConfig] = useState(() => {

          return s ? JSON.parse(s) : {
            name: 'Tournoi du CS La Verpillière',

            hasConsolation: true,

            lunchEnd: '13:30',

            pointsDraw: 1,

          };
        } catch {
          return { name: 'Tournoi du CS La Verpillière', adminPin: '1939', format: 'groups_knockout', numberOfGroups: 2, customGroups: ['Poule A', 'Poule B'], hasPlayoffs: true, hasConsolation: true, duration: 15, breakDuration: 5, startTime: '09:00', hasLunchBreak: true, lunchStart: '12:30', lunchEnd: '13:30', pointsWin: 3, pointsDraw: 1, pointsLoss: 0, qualifiersPerGroup: 2 };
        }
      });
      // État pour l'ajout d'une nouvelle poule personnalisée
      const [newCustomGroupName, setNewCustomGroupName] = useState('');

      const activeGroupNames = useMemo(() => {
        if (config.format === 'round_robin') return ['Poule Unique'];
        if (config.autoGroups === true) {
          const sizes = getPoolSizes(teams.length);
          if (sizes) return sizes.map((_,i) => alphabetPoolName(i));

        if (config.customGroups && config.customGroups.length) return config.customGroups;
        const n = Math.min(8, Math.max(2, Number(config.numberOfGroups) || 2));
        return Array.from({length:n},(_,i) => alphabetPoolName(i));
      }, [config.format,config.autoGroups,config.customGroups,config.numberOfGroups,teams.length]);

            const showToast = (message, type = 'success') => {
        setNotification({ message, type });
        setTimeout(() => setNotification(null), 3200);
      };

      const getTeam = (id) => teams.find(t => t.id === id) || { name: 'En attente', color: '#64748B', players: [] };

      // Assigner ou changer librement une équipe de poule
      const handleAssignTeamToGroup = (teamId, targetGroup) => {
        if (!activeGroupNames.includes(targetGroup) || !teams.some(t => t.id === teamId)) return;
        const oldTeam = teams.find(t => t.id === teamId);
        if (oldTeam.group === targetGroup) return;
        // Compléter les affectations encore absentes sans déplacer les choix existants.
        // Les premiers calendriers peuvent ne pas enregistrer le champ group.
        const capacities = getPoolSizes(teams.length);
        const counts = Object.fromEntries(activeGroupNames.map(g => [g,teams.filter(t => t.group === g).length]));
        const withGroups = teams.map(t => {
          if (activeGroupNames.includes(t.group)) return t;
          const selected = activeGroupNames.find((g,i) => counts[g] < (capacities?.[i] ?? Infinity)) || activeGroupNames[0];
          counts[selected]++;
          return {...t,group:selected};
        });
        const nextTeams = withGroups.map(t => t.id === teamId ? {...t,group:targetGroup} : t);
        setTeams(nextTeams);
        broadcastUpdate(config,fields,nextTeams,matches);

        // Une répartition manuelle peut provisoirement avoir 3/5 équipes.
        // On n'efface ni ne remplace jamais les choix de l'organisateur.
        const sizes = getPoolSizes(nextTeams.length);
        const balanced = config.format === 'round_robin' || (sizes &&
          activeGroupNames.length === sizes.length &&
          activeGroupNames.every((g,i) => nextTeams.filter(t => t.group === g).length === sizes[i]));
        if (!balanced) {
          showToast('Équipe déplacée. Rééquilibrez les poules (4 ou 5 équipes chacune) avant de mettre à jour le calendrier.', 'error');
          return;
        }
        if (matches.length && matches.every(m => m.status !== 'finished')) {
          // Régénère les rencontres uniquement si aucun résultat n'est saisi.
          // Permet d'afficher immédiatement les nouvelles équipes adverses.
          generateSchedule(nextTeams, true);
        } else if (matches.some(m => m.status === 'finished')) {
          showToast('Poule mise à jour. Les matchs joués sont conservés : le calendrier existant doit être vérifié avant toute régénération.');
        } else {
          showToast('Équipe déplacée : la répartition sera utilisée pour générer le calendrier.');
        }
      };

      // Ajouter une nouvelle poule libre
      const handleAddCustomGroup = () => {
        if (!newCustomGroupName.trim()) return;
        const grp = newCustomGroupName.trim();
        if (activeGroupNames.includes(grp)) {
          showToast('Cette poule existe déjà', 'error');
          return;
        }
        const updated = [...activeGroupNames, grp];
        const newCfg = { ...config, autoGroups: false, customGroups: updated, numberOfGroups: updated.length };
        setConfig(newCfg);
        setNewCustomGroupName('');
        broadcastUpdate(newCfg, fields, teams, matches);
        showToast(`Poule "${grp}" créée avec succès !`);
      };

      // Supprimer une poule
      const handleRemoveCustomGroup = (groupToRemove) => {
        if (activeGroupNames.length <= 1) {
          showToast('Conservez au moins 1 poule', 'error');
          return;
        }
        const updated = activeGroupNames.filter(g => g !== groupToRemove);
        const fallback = updated[0];
        const updatedTeams = teams.map(t => t.group === groupToRemove ? { ...t, group: fallback } : t);
        const newCfg = { ...config, autoGroups: false, customGroups: updated, numberOfGroups: updated.length };
        setConfig(newCfg);
        setTeams(updatedTeams);
        broadcastUpdate(newCfg, fields, updatedTeams, matches);
        showToast(`Poule "${groupToRemove}" retirée`);
      };

      // Renommer une poule
      const handleRenameGroup = (oldName, newName) => {
        if (!newName || !newName.trim() || oldName === newName.trim()) return;
        const fresh = newName.trim();
        const updatedGroups = activeGroupNames.map(g => g === oldName ? fresh : g);
        const updatedTeams = teams.map(t => t.group === oldName ? { ...t, group: fresh } : t);
        const updatedMatches = matches.map(m => m.group === oldName ? { ...m, group: fresh } : m);
        const newCfg = { ...config, autoGroups: false, customGroups: updatedGroups };
        setConfig(newCfg);
        setTeams(updatedTeams);
        setMatches(updatedMatches);
        broadcastUpdate(newCfg, fields, updatedTeams, updatedMatches);
        showToast(`Poule renommée en "${fresh}" !`);
      };

      // Gestion du compte à rebours du Chronomètre
      useEffect(() => {
        let interval = null;
        if (timerRunning) {
          interval = setInterval(() => {
            setTimerSeconds(prev => {
              if (prev <= 1) {
                setTimerRunning(false);
                try {
                  const synth = new Tone.Synth().toDestination();
                  synth.triggerAttackRelease("C5", "0.4");
                  setTimeout(() => synth.triggerAttackRelease("G5", "0.8"), 450);
                } catch(e) {}
                showToast('⏱ Fin du temps réglementaire !', 'success');
                return 0;
              }
              return prev - 1;
            });
          }, 1000);
        }
        return () => { if (interval) clearInterval(interval); };

      // Sauvegarde locale automatique
      useEffect(() => {
        try {
          localStorage.setItem('cslv_config', JSON.stringify(config));
          localStorage.setItem('cslv_fields', JSON.stringify(fields));
          localStorage.setItem('cslv_teams', JSON.stringify(teams));
          localStorage.setItem('cslv_matches', JSON.stringify(matches));
        } catch (e) {}
      }, [config, fields, teams, matches]);

      // Détection du rôle dans l'URL
      useEffect(() => {
        try {
          const params = new URLSearchParams(window.location.search);
          const role = params.get('role');
          if (role === 'viewer') {
            setUserRole('viewer');
            setActiveTab('matches');
          } else if (role === 'editor') {
            // Si le lien contient le rôle éditeur explicitement

          } else {
            // Par défaut si aucun paramètre : mode spectateur sécurisé
            setUserRole('viewer');
            setActiveTab('matches');
          }
        } catch (e) {}
      }, []);

      // Synchronisation Firebase en temps réel
      useEffect(() => {
        let unsubscribe = null;
        async function setupCloud() {
          let fbConfig = null;
          try {
            const params = new URLSearchParams(window.location.search);
            const cloudParam = params.get('cloud');
            if (cloudParam) {
              const decoded = JSON.parse(atob(cloudParam));
              fbConfig = {
                apiKey: decoded.k,
                projectId: decoded.p,
                authDomain: decoded.p + '.firebaseapp.com'
              };
              localStorage.setItem('cslv_firebase_config', JSON.stringify(fbConfig));
            } else {
              const saved = localStorage.getItem('cslv_firebase_config');
              if (saved) fbConfig = JSON.parse(saved);
            }
          } catch (e) {}

          if (!fbConfig || !fbConfig.apiKey || !fbConfig.projectId) {
            setCloudStatus('offline');
            return;
          }

          try {
            if (!firebase.apps.length) {
              firebase.initializeApp(fbConfig);
            }
            const db = firebase.firestore();
            dbRef.current = db;

            try {
              await firebase.auth().signInAnonymously();
            } catch (authErr) {}

            const docRef = db.collection('tournaments').doc('cslv_main_data');

            unsubscribe = docRef.onSnapshot(docSnap => {
              if (docSnap.exists) {
                const data = docSnap.data();
                isRemoteUpdate.current = true;
                if (data.config) setConfig(data.config);
                if (data.fields) setFields(data.fields);
                if (data.teams) setTeams(data.teams);
                if (data.matches) setMatches(data.matches);
                setTimeout(() => { isRemoteUpdate.current = false; }, 300);
              }
              setCloudStatus('online');
              setCloudErrorMsg('');
            }, err => {
              console.warn("Firestore listener:", err);
              setCloudStatus('error');
              setCloudErrorMsg(err.message || 'Erreur d\'accès');
            });
          } catch (err) {
            setCloudStatus('error');
            setCloudErrorMsg(err.message);
          }
        }

        setupCloud();
        return () => { if (unsubscribe) unsubscribe(); };
      }, []);

      // Émission des mises à jour vers le Cloud
      const broadcastUpdate = (newConfig, newFields, newTeams, newMatches) => {
        if (dbRef.current && cloudStatus === 'online' && !isRemoteUpdate.current) {
          try {
            const clean = (obj) => JSON.parse(JSON.stringify(obj, (k, v) => v === undefined ? null : v));
            dbRef.current.collection('tournaments').doc('cslv_main_data').set({
              config: clean(newConfig || config),
              fields: clean(newFields || fields),
              teams: clean(newTeams || teams),
              matches: clean(newMatches || matches),
              updatedAt: new Date().toISOString()
            }, { merge: true }).catch(e => console.error("Cloud push error:", e));
          } catch (err) {
            console.error("Clean error:", err);
          }
        }
      };

      const timeToMinutes = (timeStr) => {
        if (!timeStr) return 0;
        const [h, m] = timeStr.split(':').map(Number);
        return (h || 0) * 60 + (m || 0);
      };

      const minutesToTime = (totalMinutes) => {
        const mins = Math.max(0, Math.floor(totalMinutes));
        const h = Math.floor(mins / 60) % 24;
        const m = mins % 60;
        return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
      };

      // Réinitialiser le calendrier (scores & matchs uniquement)

        showToast("Calendrier des matchs réinitialisé !");
      };

      // Réinitialiser l'ensemble du tournoi (Équipes + Matchs)
      const handleResetWholeTournament = () => {
        if (!window.confirm("ATTENTION : Cette action supprimera TOUTES les équipes, tous les matchs, buteurs et classements. Continuer ?")) return;
        setMatches([]);
        setTeams([]);
        broadcastUpdate(config, fields, [], []);
        showToast("Le tournoi a été entièrement remis à zéro !");
      };

      // Déplacer l'ordre d'un match (Monter / Descendre)
      const handleMoveMatchOrder = (matchId, direction) => {
        const sorted = [...matches].sort((a, b) => timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
        const index = sorted.findIndex(m => m.id === matchId);
        if (index < 0) return;
        const targetIndex = direction === 'up' ? index - 1 : index + 1;
        if (targetIndex < 0 || targetIndex >= sorted.length) return;

        // Échange des horaires et terrains entre les deux matchs
        const currentMatch = sorted[index];
        const targetMatch = sorted[targetIndex];

        const tempStart = currentMatch.startTime;
        const tempEnd = currentMatch.endTime;
        const tempFieldId = currentMatch.fieldId;
        const tempFieldName = currentMatch.fieldName;

        currentMatch.startTime = targetMatch.startTime;
        currentMatch.endTime = targetMatch.endTime;
        currentMatch.fieldId = targetMatch.fieldId;
        currentMatch.fieldName = targetMatch.fieldName;

        targetMatch.startTime = tempStart;
        targetMatch.endTime = tempEnd;
        targetMatch.fieldId = tempFieldId;
        targetMatch.fieldName = tempFieldName;

        const updated = matches.map(m => {
          if (m.id === currentMatch.id) return { ...currentMatch };
          if (m.id === targetMatch.id) return { ...targetMatch };
          return m;
        });

        setMatches(updated);
        broadcastUpdate(config, fields, teams, updated);
        showToast("Ordre du match modifié !");
      };

      // Renommer une équipe
      const handleRenameTeam = () => {
        if (!editingTeamNameModal || !editTeamNameInput.trim()) return;
        const updatedTeams = teams.map(t => t.id === editingTeamNameModal.id ? { ...t, name: editTeamNameInput.trim() } : t);
        setTeams(updatedTeams);
        setEditingTeamNameModal(null);
        setEditTeamNameInput('');
        broadcastUpdate(config, fields, updatedTeams, matches);
        showToast("Nom de l'équipe mis à jour !");
      };

      // Déplacer une équipe dans une autre poule sans créer de doublon
      const handleSwapTeamPool = (sourceTeamId, targetGroup) => {
        if (!targetGroup) return;

        // Trouver une équipe de la poule cible pour échanger les places proprement
        const numGroups = parseInt(config.numberOfGroups, 10) || 2;
        const groupNames = ['Poule A', 'Poule B', 'Poule C', 'Poule D'].slice(0, numGroups);

        // Repérer la poule actuelle de l'équipe
        const currentMatch = matches.find(m => m.group && m.group.startsWith('Poule') && (m.team1Id === sourceTeamId || m.team2Id === sourceTeamId));
        const currentGroup = currentMatch ? currentMatch.group : null;
        if (!currentGroup || currentGroup === targetGroup) return;

        // Chercher une équipe de la poule cible
        const targetTeamMatch = matches.find(m => m.group === targetGroup && (m.team1Id !== sourceTeamId && m.team2Id !== sourceTeamId));
        const targetTeamId = targetTeamMatch ? (targetTeamMatch.team1Id || targetTeamMatch.team2Id) : null;

        if (targetTeamId) {
          // Échanger les 2 équipes dans tous les matchs de poules existants
          const updatedMatches = matches.map(m => {
            if (!m.group || !m.group.startsWith('Poule')) return m;
            let t1 = m.team1Id;
            let t2 = m.team2Id;

            if (t1 === sourceTeamId) t1 = targetTeamId;
            else if (t1 === targetTeamId) t1 = sourceTeamId;

            if (t2 === sourceTeamId) t2 = targetTeamId;
            else if (t2 === targetTeamId) t2 = sourceTeamId;

            return {
              ...m,
              team1Id: t1,
              team2Id: t2
            };
          });

          setMatches(updatedMatches);
          broadcastUpdate(config, fields, teams, updatedMatches);
          showToast(`Permutation effectuée entre ${getTeam(sourceTeamId).name} et ${getTeam(targetTeamId).name} !`);
        } else {
          showToast("Impossible de permuter : aucune équipe trouvée dans la poule cible", "error");
        }
      };

      // Calendrier multi-poules et élimination directe, sans perte involontaire de résultats.
      const generateSchedule = (overrideTeams = null, automatic = false) => {
        const sourceTeams = Array.isArray(overrideTeams) ? overrideTeams : teams;
        if (sourceTeams.length < 2 || fields.length === 0) { showToast('Il faut au moins 2 équipes et un terrain.','error'); return; }
        if (!automatic && matches.some(m => m.status === 'finished') && !window.confirm('ATTENTION : générer un nouveau calendrier efface les résultats enregistrés. Continuer ?')) return;
        let rawMatches = [];
        let nextTeams = sourceTeams;
        if (config.format === 'knockout') rawMatches = generateKnockoutTree(sourceTeams);
        else {
          const names = config.format === 'round_robin' ? ['Poule Unique'] : activeGroupNames;
          let sizes;
          if (config.format === 'round_robin') sizes = [sourceTeams.length];
          else {
            const autoSizes = getPoolSizes(sourceTeams.length);
            if (!autoSizes) { showToast('Pour les poules de 4 ou 5, choisissez un nombre PAIR d’équipes entre 8 et 32.','error');return; }
            if (names.length !== autoSizes.length) {
              showToast(`Pour ${sourceTeams.length} équipes : ${autoSizes.length} poules obligatoires. Activez la répartition automatique.`, 'error');return;
            }
            sizes = autoSizes;
          }
          const targetGroups = names.map((name,i) => ({name,size:sizes[i],members:[]}));
          // À la première génération seulement, répartir les équipes sans poule attribuée.
          // Après la moindre affectation manuelle, ne modifier aucune poule en silence.
          const pristine = sourceTeams.every(t => !t.group);
          if (pristine) {
            sourceTeams.forEach((t,i) => {
              const target = targetGroups.find(g => g.members.length < g.size);
              if (target) target.members.push(t);
            });
          }
          const allAssignmentsValid = pristine || (sourceTeams.every(t => names.includes(t.group)) &&
            names.every((g,i) => sourceTeams.filter(t => t.group === g).length === sizes[i]));
          if (!allAssignmentsValid) {
            const summary = targetGroups.map(g => `${g.name}: ${sourceTeams.filter(t => t.group === g.name).length}/${g.size}`).join(' · ');
            showToast(`Affectations non équilibrées : ${summary}. Déplacez les équipes puis recommencez.`, 'error');
            return;
          }
          // Les poules explicitement choisies sont la seule source pour le calendrier.
          if (!pristine) targetGroups.forEach(g => {g.members = sourceTeams.filter(t=>t.group===g.name);});
          const mapGroup = new Map(targetGroups.flatMap(g => g.members.map(t => [t.id,g.name])));
          nextTeams = sourceTeams.map(t => ({...t, group:mapGroup.get(t.id)}));
          const perPool = targetGroups.map(g => generateRoundRobin(g.members,g.name));
          const maxMatches = Math.max(...perPool.map(a=>a.length),0);
          for(let i=0;i<maxMatches;i++) perPool.forEach(a=>{if(a[i])rawMatches.push(a[i]);});
          if (config.format !== 'round_robin') {
            rawMatches.push(...createTournamentPhases(names,sizes,config.hasPlayoffs !== false,config.hasConsolation !== false));
          }
        }
        const duration = Number(config.duration)||15, pause=Number(config.breakDuration)||5;
        const lunchStart = timeToMinutes(config.lunchStart||'12:30'), lunchEnd=timeToMinutes(config.lunchEnd||'13:30');
        const availability = fields.map(f=>({fieldId:f.id, fieldName:f.name,next:timeToMinutes(config.startTime||'09:00')}));
        const scheduled = rawMatches.map(m=>{
          availability.sort((a,b)=>a.next-b.next);
          const f=availability[0];
          let start=f.next;
          if(config.hasLunchBreak && start<lunchEnd && start+duration>lunchStart)start=Math.max(start,lunchEnd);
          f.next=start+duration+pause;
          return {...m,fieldId:f.fieldId,fieldName:f.fieldName,startTime:minutesToTime(start),endTime:minutesToTime(start+duration)};
        });
        setTeams(nextTeams);setMatches(scheduled);
        broadcastUpdate(config,fields,nextTeams,scheduled);
        showToast(`Calendrier : ${scheduled.length} matchs, ${config.format==='knockout'?0:config.format==='round_robin'?1:activeGroupNames.length} poules.`);
        setActiveTab('matches');
      };


            const generateRoundRobin = (teamList, groupName) => {
        let t = [...teamList];
        if (t.length % 2 !== 0) t.push({ id: 'bye', name: 'Exempt', isBye: true });
        const n = t.length;
        const rounds = n - 1;
        const matchesPerRound = n / 2;
        const result = [];

        for (let round = 0; round < rounds; round++) {
          for (let m = 0; m < matchesPerRound; m++) {
            const home = (round + m) % (n - 1);
            let away = (n - 1 - m + round) % (n - 1);
            if (m === 0) away = n - 1;

            const t1 = t[home];
            const t2 = t[away];

            if (!t1.isBye && !t2.isBye) {
              result.push({
                id: `m-${groupName}-${round + 1}-${t1.id}-${t2.id}`,
                group: groupName,
                stage: `Journée ${round + 1}`,
                team1Id: t1.id,
                team2Id: t2.id,
                score1: null,
                score2: null,
                pens1: null,
                pens2: null,
                status: 'pending',
                events: []
              });
            }
          }
        }
        return result;
      };

      const generateKnockoutTree = (teamList) => {
        const matches = [];
        const n = teamList.length;
        for (let i = 0; i < Math.floor(n / 2); i++) {
          matches.push({
            id: `ko-qf-${i}`,
            stage: n > 4 ? `Quart de Finale ${i + 1}` : `Demi-Finale ${i + 1}`,
            group: 'Phase Finale',
            team1Id: teamList[i * 2]?.id || null,
            team2Id: teamList[i * 2 + 1]?.id || null,
            score1: null,
            score2: null,
            status: 'pending',
            events: []
          });
        }
        return matches;
      };

      // Gestion des Terrains
      const handleAddField = () => {
        if (!newFieldName.trim()) return;
        const newFields = [...fields, { id: `f-${Date.now()}`, name: newFieldName.trim() }];
        setFields(newFields);
        setNewFieldName('');
        broadcastUpdate(config, newFields, teams, matches);
        showToast('Terrain ajouté');
      };

      const handleRemoveField = (id) => {
        if (fields.length <= 1) {
          showToast('Conservez au moins un terrain !', 'error');
          return;
        }
        const updated = fields.filter(f => f.id !== id);
        setFields(updated);
        broadcastUpdate(config, updated, teams, matches);
      };

      // Gestion des Équipes
      const handleAddTeam = () => {
        if (!newTeamName.trim()) return;
        const newTeam = {
          id: `t-${Date.now()}`,
          name: newTeamName.trim(),
          color: selectedColor,
          players: []
        };
        const updated = [...teams, newTeam];
        setTeams(updated);
        setNewTeamName('');
        broadcastUpdate(config, fields, updated, matches);
        showToast(`Équipe "${newTeam.name}" inscrite !`);
      };

      const handleRemoveTeam = (id) => {
        const updated = teams.filter(t => t.id !== id);
        setTeams(updated);
        broadcastUpdate(config, fields, updated, matches);
        showToast('Équipe retirée');
      };

      const handleAddPlayerToTeam = (teamId, pName) => {
        if (!pName || !pName.trim()) return;
        const updated = teams.map(t => {
          if (t.id === teamId) {
            return { ...t, players: [...(t.players || []), pName.trim()] };
          }
          return t;
        });
        setTeams(updated);
        setNewPlayerInputs({ ...newPlayerInputs, [teamId]: '' });
        broadcastUpdate(config, fields, updated, matches);
        showToast('Joueur ajouté à l\'effectif');
      };

      const handleRemovePlayerFromTeam = (teamId, idx) => {
        const updated = teams.map(t => {
          if (t.id === teamId) {
            const p = [...(t.players || [])];
            p.splice(idx, 1);
            return { ...t, players: p };
          }
          return t;
        });
        setTeams(updated);
        broadcastUpdate(config, fields, updated, matches);
      };

      // Classements cohérents avec la composition des poules et les qualifications.
      const calculateStandings = (groupFilter = null) => {
        if (groupFilter) return standingsFor(teams,matches,groupFilter,config);
        const names = config.format==='round_robin'?['Poule Unique']:activeGroupNames;
        return names.flatMap(g=>standingsFor(teams,matches,g,config));
      };

            // Sauvegarde du match
      const saveMatchDetails = () => {
        if (!editingMatch) return;

        // Si match à élimination directe et égalité : obliger la saisie des penalties
        const isKnockout = editingMatch.group && (editingMatch.group.includes('Finale') || editingMatch.group.includes('Consolante') || editingMatch.group.includes('Classement') || editingMatch.group.includes('Élimination'));
        if (isKnockout && editingMatch.score1 !== null && editingMatch.score1 === editingMatch.score2 && editingMatch.status === 'finished') {
          if (editingMatch.pens1 === null || editingMatch.pens2 === null || editingMatch.pens1 === editingMatch.pens2) {
            showToast('Match nul en phase finale : veuillez renseigner les Tirs au But pour désigner un vainqueur !', 'error');
            return;
          }
        }

        let updated = matches.map(m => m.id === editingMatch.id ? editingMatch : m);

        const standingsFromMatches = groupName => standingsFor(teams,updated,groupName,config);
        const isGroupComplete = (groupName) => {
          const fixtures = updated.filter(m => m.group === groupName);
          return fixtures.length > 0 && fixtures.every(m => m.status === 'finished');
        };
        const winnerOf = (matchId) => {
          const m = updated.find(m => m.id === matchId);
          if (!m || m.status !== 'finished' || !m.team1Id || !m.team2Id) return null;
          if (Number(m.score1) > Number(m.score2)) return m.team1Id;
          if (Number(m.score2) > Number(m.score1)) return m.team2Id;
          if (m.pens1 != null && m.pens2 != null && Number(m.pens1) !== Number(m.pens2))
            return Number(m.pens1) > Number(m.pens2) ? m.team1Id : m.team2Id;
          return null;
        };
        const loserOf = (matchId) => {
          const m = updated.find(m => m.id === matchId), winner = winnerOf(matchId);
          if (!m || !winner) return null;
          return winner === m.team1Id ? m.team2Id : m.team1Id;
        };
        const resolveSource = (source) => {
          if (!source) return null;
          if (source.kind === 'winner') return winnerOf(source.matchId);
          if (source.kind === 'loser') return loserOf(source.matchId);
          if (source.kind === 'rank' && isGroupComplete(source.group))
            return standingsFromMatches(source.group)[source.position]?.team.id || null;
          return null;
        };
        // Pour les nouveaux calendriers : résolution des quarts, demies et finales.
        // Pour les calendriers déjà enregistrés : compatibilité avec les anciens IDs.
        const groupNames = config.format === 'round_robin' ? ['Poule Unique'] : activeGroupNames;
        const n = groupNames.length;
        const legacySource = (m, side) => {
          const a = groupNames[0], b = groupNames[1];
          if (n === 1) {
            if (m.id === 'ko-semi-1') return side === 1 ? {kind:'rank',group:a,position:0} : {kind:'rank',group:a,position:3};
            if (m.id === 'ko-semi-2') return side === 1 ? {kind:'rank',group:a,position:1} : {kind:'rank',group:a,position:2};
          }
          if (n === 2) {
            const old = {
              'ko-semi-1': [{kind:'rank',group:a,position:0},{kind:'rank',group:b,position:1}],
              'ko-semi-2': [{kind:'rank',group:b,position:0},{kind:'rank',group:a,position:1}],
              'cons-semi-1': [{kind:'rank',group:a,position:2},{kind:'rank',group:b,position:3}],
              'cons-semi-2': [{kind:'rank',group:b,position:2},{kind:'rank',group:a,position:3}],
              'cons-final': [{kind:'winner',matchId:'cons-semi-1'},{kind:'winner',matchId:'cons-semi-2'}],
              'rank-7-8': [{kind:'loser',matchId:'cons-semi-1'},{kind:'loser',matchId:'cons-semi-2'}]
            };
            if (old[m.id]) return old[m.id][side-1];
          }
          if (m.id === 'ko-final') return {kind:'winner',matchId:side === 1 ? 'ko-semi-1' : 'ko-semi-2'};
          return null;
        };
        // Plusieurs passages permettent d'alimenter tous les tours jusqu'à la finale.
        for (let pass=0;pass<6;pass++) {
          const fixtures=updated.filter(m=>['Phase Finale Principale','Tournoi Consolante','Tournoi Classement'].includes(m.group));
          fixtures.forEach(f=>{
            const a=resolveSource(f.source1||legacySource(f,1));
            const b=resolveSource(f.source2||legacySource(f,2));
            if (!f.source1 && !f.source2 && !legacySource(f,1) && !legacySource(f,2)) return;
            updated=updated.map(m=>{
              if(m.id!==f.id || m.status==='finished') return m;
              return {...m,team1Id:a||null,team2Id:b||null};
            });
          });
        }

        setMatches(updated);
        broadcastUpdate(config, fields, teams, updated);
        setEditingMatch(null);
        showToast('Score et match enregistrés !');
      };

      // Statistiques globales
      const stats = useMemo(() => {
        const scorers = {};
        const mvps = {};
        let totalGoals = 0;
        let totalCards = 0;

        matches.forEach(m => {
          if (m.mvp) {
            mvps[m.mvp] = (mvps[m.mvp] || 0) + 1;
          }
          if (m.events) {
            m.events.forEach(e => {
              if (e.type === 'goal') {
                totalGoals++;
                const key = `${e.player}__${e.teamId}`;
                scorers[key] = scorers[key] || { player: e.player, teamId: e.teamId, count: 0 };
                scorers[key].count++;
              }
              if (e.type === 'yellow' || e.type === 'red') totalCards++;
            });
          }
        });

        const topScorers = Object.values(scorers).sort((a, b) => b.count - a.count).slice(0, 5);
        const topMvps = Object.entries(mvps).map(([player, count]) => ({ player, count })).sort((a, b) => b.count - a.count);

        return {
          topScorers,
          topMvps,
          totalGoals,
          totalCards,
          completedMatches: matches.filter(m => m.status === 'finished').length,
          totalMatches: matches.length
        };
      }, [matches]);

      // Liens de partage complets
      const buildShareUrl = (role) => {
        let base = OFFICIAL_PUBLIC_URL;
        let query = `?role=${role}`;
        try {
          const saved = localStorage.getItem('cslv_firebase_config');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed.apiKey && parsed.projectId) {
              const mini = { k: parsed.apiKey, p: parsed.projectId };
              query += `&cloud=${btoa(JSON.stringify(mini))}`;
            }
          }
        } catch (e) {}
        return `${base}${query}`;
      };

      // Affiche dédiée : navigation classique plutôt que popup, compatible iPhone Safari.
      const printQrPoster = () => {
        const target = buildShareUrl(selectedQrType);
        window.location.assign(`./affiche-qr.html?target=${encodeURIComponent(target)}&titre=${encodeURIComponent(config.name || 'Tournoi CS La Verpillière')}`);
      };

      const copyToClipboard = (text, type) => {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          setCopiedLinkType(type);
          showToast('Lien copié dans le presse-papier !');
          setTimeout(() => setCopiedLinkType(null), 2500);
        } catch (e) {
          showToast('Erreur de copie', 'error');
        }
      };

      return (
        <div className="min-h-screen bg-[#0e0708] text-slate-100 flex flex-col font-sans">
          {/* Notification Toast */}
          {notification && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl border text-xs sm:text-sm font-bold shadow-2xl transition animate-bounce ${
              notification.type === 'error' ? 'bg-rose-950 border-rose-600 text-rose-200' : 'bg-red-950 border-amber-500 text-amber-200'
            }`}>
              {notification.message}
            </div>
          )}

          {/* En-tête officiel Sang et Or */}
          <header className="border-b border-red-950 bg-gradient-to-r from-[#200507] via-[#160507] to-[#1c0608] sticky top-0 z-40 shadow-xl">
            <div className="max-w-7xl mx-auto px-3 sm:px-6 py-2.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <ClubLogo className="w-11 h-11 sm:w-12 sm:h-12" />
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="font-black text-base sm:text-lg text-white leading-tight">{config.name}</h1>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full uppercase ${
                      userRole === 'editor' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-red-500/20 text-red-300 border border-red-500/30'
                    }`}>
                      {userRole === 'editor' ? 'Organisateur' : 'Spectateur'}
                    </span>
                  </div>
                  <div className="flex items-center gap-2 text-[11px] text-amber-400 font-semibold">
                    <span>CS La Verpillière 1939</span>
                    <span className="text-slate-400">•</span>
                    <span className={cloudStatus === 'online' ? 'text-emerald-400 font-bold flex items-center gap-1' : 'text-slate-400'}>
                      {cloudStatus === 'online' && <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>}
                      {cloudStatus === 'online' ? 'En direct (Cloud)' : (
                        <button 
                          onClick={() => setFirebaseModalOpen(true)} 
                          className="hover:text-amber-400 underline decoration-dotted text-slate-400 font-medium"
                          title="Cliquer pour configurer ou reconnecter le Cloud"
                        >
                          Mode Local (⚡ Reconnecter)
                        </button>
                      )}
                    </span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5 sm:gap-2">
                {userRole === 'editor' && (
                  <button
                    onClick={() => setShowTimerModal(true)}
                    className="px-2.5 py-1.5 rounded-lg border border-amber-500/60 bg-[#1f080c] hover:bg-[#300c14] text-xs font-black text-amber-300 transition flex items-center gap-1 shadow-md"
                    title="Ouvrir le chronomètre de match"
                  >
                    ⏱ {minutesToTime(Math.floor(timerSeconds / 60))}:{String(timerSeconds % 60).padStart(2, '0')}
                  </button>
                )}

                {userRole === 'editor' ? (
                  <button
                    onClick={() => {
                      setUserRole('viewer');
                      if (activeTab === 'config') setActiveTab('matches');
                      showToast('Mode Spectateur activé');
                    }}
                    className="px-2.5 py-1.5 rounded-lg border border-red-900/60 bg-[#1f080c] hover:bg-[#2d0c12] text-xs font-bold text-amber-300 transition"
                    title="Basculer vers la vue publique spectateur"
                  >
                    👁 Vue Spectateur
                  </button>
                ) : (
                  <button
                    onClick={() => {
                      setPinInput('');
                      setPinError('');
                      setAdminPinModalOpen(true);
                    }}
                    className="px-2.5 py-1.5 rounded-lg border border-amber-600/50 bg-[#1f080c] hover:bg-[#2d0c12] text-xs font-bold text-amber-400 transition flex items-center gap-1"
                    title="Déverrouiller le mode organisateur avec le code PIN"
                  >
                    🔒 Accès Organisateur
                  </button>
                )}

                  <span className="text-xs font-bold text-amber-300 block">⭐ Homme du Match (MVP)</span>
                  {(() => {
                    const t1 = getTeam(editingMatch.team1Id);
                    const t2 = getTeam(editingMatch.team2Id);
                    const allPlayers = [
                      ...(t1.players || []).map(p => ({ player: p, teamName: t1.name })),
                      ...(t2.players || []).map(p => ({ player: p, teamName: t2.name }))
                    ];
                    return (
                      <div className="space-y-1.5">
                        <select
                          value={editingMatch.mvp || ''}
                          onChange={(e) => setEditingMatch({ ...editingMatch, mvp: e.target.value })}
                          className="w-full bg-[#18080a] border border-red-900/60 rounded-lg p-2 text-xs text-white"
                        >
                          <option value="">-- Choisir le meilleur joueur du match --</option>
                          {allPlayers.length > 0 ? (
                            allPlayers.map((item, idx) => (
                              <option key={idx} value={item.player}>
                                {item.player} ({item.teamName})
                              </option>
                            ))
                          ) : (
                            <option disabled value="">Aucun joueur dans les effectifs (saisir manuellement ci-dessous)</option>
                          )}
                        </select>
                        <input
                          type="text"
                          placeholder="Ou saisir un nom manuellement..."
                          value={editingMatch.mvp || ''}
                          onChange={(e) => setEditingMatch({ ...editingMatch, mvp: e.target.value })}
                          className="w-full bg-[#18080a] border border-red-900/60 rounded-lg px-2.5 py-1 text-[11px] text-slate-300 placeholder-slate-600"
                        />
                      </div>
                    );
                  })()}
                </div>

                {/* Ajouter un buteur */}
                <div className="bg-[#0b0304] p-3 rounded-xl border border-red-950 space-y-2">
                  <span className="text-xs font-bold text-amber-300 block">⚽ Ajouter un But</span>
                  <div className="flex flex-col sm:flex-row gap-2">
                    <select
                      value={goalTeamId || editingMatch.team1Id || ''}
                      onChange={(e) => {
                        setGoalTeamId(e.target.value);
                        setGoalScorerName('');
                      }}
                      className="bg-[#18080a] border border-red-900/60 rounded-lg p-1.5 text-xs text-white"
                    >
                      <option value={editingMatch.team1Id}>{getTeam(editingMatch.team1Id).name}</option>
                      <option value={editingMatch.team2Id}>{getTeam(editingMatch.team2Id).name}</option>
                    </select>

                    {(() => {
                      const currentTeamId = goalTeamId || editingMatch.team1Id;
                      const activeTeam = getTeam(currentTeamId);
                      const players = activeTeam.players || [];
                      return (
                        <div className="flex-1 flex gap-1.5">
                          <select
                            value={goalScorerName}
                            onChange={(e) => setGoalScorerName(e.target.value)}
                            className="flex-1 bg-[#18080a] border border-red-900/60 rounded-lg p-1.5 text-xs text-white"
                          >
                            <option value="">-- Choisir le buteur --</option>
                            {players.map((p, idx) => (
                              <option key={idx} value={p}>{p}</option>
                            ))}
                            <option value="__custom__">Autre (saisie libre)</option>
                          </select>
                          {(!players.length || goalScorerName === '__custom__') && (
                            <input
                              type="text"
                              placeholder="Nom..."
                              onChange={(e) => setGoalScorerName(e.target.value)}
                              className="w-28 bg-[#18080a] border border-red-900/60 rounded-lg p-1.5 text-xs text-white"
                            />
                          )}
                        </div>
                      );
                    })()}
                  </div>
                  <button
                    onClick={() => {
                      const finalName = goalScorerName === '__custom__' ? '' : goalScorerName;
                      const effectiveTeamId = goalTeamId || editingMatch.team1Id;
                      if (!finalName.trim() || !effectiveTeamId) return;
                      const isT1 = effectiveTeamId === editingMatch.team1Id;
                      setEditingMatch({
                        ...editingMatch,
                        score1: isT1 ? (Number(editingMatch.score1) || 0) + 1 : Number(editingMatch.score1) || 0,
                        score2: !isT1 ? (Number(editingMatch.score2) || 0) + 1 : Number(editingMatch.score2) || 0,
                        events: [...(editingMatch.events || []), { id: Date.now(), type: 'goal', player: finalName.trim(), teamId: effectiveTeamId }]
                      });
                      setGoalScorerName('');
                    }}
                    className="w-full py-1.5 bg-[#20080c] text-amber-300 font-bold rounded-lg text-xs border border-amber-500/30"
                  >
                    + Enregistrer le but (+1 score)
                  </button>
                </div>

                <div className="flex justify-end gap-2 pt-2 border-t border-red-950">
                  <button onClick={() => setEditingMatch(null)} className="px-3 py-1.5 text-xs text-slate-400">Annuler</button>
                  <button onClick={saveMatchDetails} className="px-5 py-2 bg-gradient-to-r from-amber-500 to-amber-600 text-slate-950 font-black rounded-xl text-xs">
                    Valider & Enregistrer
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Composant Tableau du Classement
    function StandingsTable({ standings }) {
      if (!standings || standings.length === 0) {
        return <div className="text-center py-6 text-xs text-slate-500 italic">Aucune donnée disponible.</div>;
      }
      return (
        <div className="overflow-x-auto">
          <table className="w-full text-left text-xs">
            <thead>
              <tr className="border-b border-red-950 text-slate-400 uppercase tracking-wider font-semibold">
                <th className="py-2 px-1 text-center w-6">#</th>
                <th className="py-2 px-2">Club</th>
                <th className="py-2 px-1 text-center font-bold text-amber-300">PTS</th>
                <th className="py-2 px-1 text-center">J</th>
                <th className="py-2 px-1 text-center">G</th>
                <th className="py-2 px-1 text-center">N</th>
                <th className="py-2 px-1 text-center">P</th>
                <th className="py-2 px-1 text-center">BP</th>
                <th className="py-2 px-1 text-center">BC</th>
                <th className="py-2 px-1 text-center">+/-</th>
              </tr>
            </thead>
            <tbody className="divide-y divide-red-950/60 font-medium">
              {standings.map((r, idx) => (
                <tr key={r.team.id} className={idx < 2 ? 'bg-amber-500/5' : ''}>
                  <td className="py-2.5 px-1 text-center font-bold">
                    <span className={`inline-flex items-center justify-center w-5 h-5 rounded ${idx === 0 ? 'bg-amber-400 text-slate-950 font-black' : idx === 1 ? 'bg-red-900 text-amber-200' : 'text-slate-500'}`}>
                      {idx + 1}
                    </span>
                  </td>
                  <td className="py-2.5 px-2">
                    <div className="flex items-center gap-2">
                      <span className="w-2.5 h-2.5 rounded-full flex-shrink-0" style={{ backgroundColor: r.team.color }}></span>
                      <span className="font-bold text-white truncate">{r.team.name}</span>
                    </div>
                  </td>
                  <td className="py-2.5 px-1 text-center font-black text-amber-300 bg-amber-500/10">{r.points}</td>
                  <td className="py-2.5 px-1 text-center text-slate-300">{r.played}</td>
                  <td className="py-2.5 px-1 text-center text-slate-300">{r.won}</td>
                  <td className="py-2.5 px-1 text-center text-slate-300">{r.drawn}</td>
                  <td className="py-2.5 px-1 text-center text-slate-300">{r.lost}</td>
                  <td className="py-2.5 px-1 text-center text-slate-400">{r.gf}</td>
                  <td className="py-2.5 px-1 text-center text-slate-400">{r.ga}</td>
                  <td className={`py-2.5 px-1 text-center font-bold ${r.gd > 0 ? 'text-amber-400' : r.gd < 0 ? 'text-rose-400' : 'text-slate-400'}`}>
                    {r.gd > 0 ? `+${r.gd}` : r.gd}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
