<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tournoi CSV — Imprimer le planning</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#171717;background:#f1f1f1}*{box-sizing:border-box}body{margin:0}.toolbar{max-width:1180px;margin:20px auto 0;padding:12px 16px;border:1px solid #e4d5d5;border-radius:9px;background:white;display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.btn{cursor:pointer;background:#88262f;color:#fff;border:0;border-radius:8px;padding:12px 16px;font-weight:700;font-size:14px}.btn.alt{background:#eee;color:#222}.paper{max-width:1180px;margin:14px auto;padding:26px 34px 48px;background:#fff;box-shadow:0 2px 20px #0001;min-height:70vh}.title{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:4px solid #752029;padding-bottom:16px}.title h1{color:#6e2028;font-size:25px;margin:0 0 4px}.muted{font-size:12px;color:#666}.badge{font-weight:700;border:1px solid #d2b2b5;border-radius:20px;padding:7px 12px;font-size:11px;color:#7c2830}.group{margin:22px 0;break-inside:avoid-page}.group h2{background:#f4e7e8;padding:9px 12px;font-size:16px;margin:0 0 5px;color:#692029;border-left:4px solid #8f2832}.schedule{width:100%;border-collapse:collapse;font-size:12px}.schedule th{background:#ececec;font-size:11px;text-align:left}.schedule th,.schedule td{padding:9px 10px;border-bottom:1px solid #ddd;vertical-align:top}.schedule td.time{font-weight:700;white-space:nowrap}.schedule td.score{font-weight:700;white-space:nowrap}.schedule tr:nth-child(even){background:#fafafa}.footnote{font-size:11px;color:#666;margin-top:18px}.empty{padding:36px;text-align:center;color:#666}@page{size:A4 landscape;margin:12mm}@media(max-width:600px){.toolbar{margin:0;border-radius:0}.paper{padding:15px;margin:0}.title h1{font-size:19px}.schedule th,.schedule td{padding:5px 4px;font-size:10px}}@media print{html,body{background:#fff}.toolbar{display:none!important}.paper{margin:0;padding:0;box-shadow:none;max-width:none;min-height:0}.group{break-inside:auto}.group h2{break-after:avoid}.schedule thead{display:table-header-group}.schedule tr{break-inside:avoid}.footnote{color:#555}}
</style></head><body>
<div class="toolbar"><div><strong>🖨️ Planning Tournoi CSV</strong><div class="muted">Impression papier ou « Enregistrer au format PDF » depuis le navigateur</div></div><div><button class="btn alt" type="button" id="back">← Revenir au tournoi</button> <button type="button" class="btn" id="print">Imprimer / PDF</button></div></div>
<main class="paper"><header class="title"><div><h1>⚽ Planning — Tournoi CSV</h1><div id="day" class="muted"></div></div><span class="badge" id="count"></span></header><div id="report"><p class="empty">Chargement du programme…</p></div><p class="footnote">Programme indicatif : les éventuelles modifications du planning sont publiées dans l'application Tournoi CSV. Imprimé le <span id="printed"></span>.</p></main>
<script>
(function(){'use strict';document.getElementById('back').onclick=()=>{if(history.length>1)history.back();else location.assign('./');};document.getElementById('print').onclick=()=>window.print();
const root=document.getElementById('report');let payload;try{payload=JSON.parse(localStorage.getItem('cslv_print_report_v60')||'null');}catch(e){};
if(!payload||!Array.isArray(payload.matches)){root.textContent='Aucun programme à imprimer. Ouvre le Planning général puis « Préparer l’impression / PDF ». ';return;}
let dateLabel=payload.date;try{dateLabel=new Date(payload.date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){}
document.getElementById('day').textContent=dateLabel;
document.getElementById('count').textContent=payload.matches.length+' créneaux';
document.getElementById('printed').textContent=new Date().toLocaleString('fr-FR');root.textContent='';
const groups=new Map(), byField=payload.group!=='category';for(const match of payload.matches){const label=String((byField?match.field:match.category)||'Non classé');if(!groups.has(label))groups.set(label,[]);groups.get(label).push(match);}
const cell=(row,value,cls)=>{const td=document.createElement('td');td.textContent=String(value??'');if(cls)td.className=cls;row.appendChild(td);};
if(!groups.size){const p=document.createElement('p');p.className='empty';p.textContent='Aucun match correspondant aux filtres sélectionnés.';root.appendChild(p);return;}
for(const [group,items] of [...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0],'fr'))){const section=document.createElement('section');section.className='group';const title=document.createElement('h2');title.textContent=group;section.appendChild(title);
const table=document.createElement('table');table.className='schedule';const head=document.createElement('thead');const hr=document.createElement('tr');for(const title of ['Horaire',byField?'Catégorie':'Terrain','Rencontre / Réservation','Score','Statut']){const th=document.createElement('th');th.textContent=title;hr.appendChild(th);}head.appendChild(hr);table.appendChild(head);
const tbody=document.createElement('tbody');items.sort((a,b)=>String(a.startTime).localeCompare(String(b.startTime))).forEach(m=>{const tr=document.createElement('tr');cell(tr,(m.startTime||'')+' – '+(m.endTime||''),'time');cell(tr,byField?m.category:m.field);cell(tr,m.title);cell(tr,m.score,'score');cell(tr,m.status);tbody.appendChild(tr);});table.appendChild(tbody);section.appendChild(table);root.appendChild(section);}
})();
</script></body></html>
