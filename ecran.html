<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#13070a">
  <meta name="robots" content="noindex,nofollow">
  <title>Tournoi · Écran géant</title>
  <link rel="stylesheet" href="./ecran.css?v=7.4.13">
  <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script defer src="./ecran.js?v=7.4.24"></script>
</head>
<body data-screen-mode="live">
  <div id="csv-screen" class="screen-shell">
    <header class="topbar">
      <div class="brand">
        <img class="crest" src="./icon-512.png" alt="Blason du Club Sportif La Verpillière">
        <div class="brand-copy"><div class="brand-eyebrow">CS LA VERPILLIÈRE · 1939</div><div class="brand-title">TOURNOI</div></div>
      </div>
      <div class="headline-meta"><div class="headline-label" id="screen-category">U10 - U11</div><div id="screen-day" class="headline-date">Programme du tournoi</div></div>
      <div class="right-meta"><div id="screen-connection" class="live-indicator waiting"><span class="signal-dot"></span>CONNEXION…</div><div id="screen-clock" class="clock">--:--</div></div>
    </header>
    <main id="screen-content" class="content" aria-live="polite">
      <div class="empty-state"><div class="empty-icon">⚽</div><h1>Connexion au tournoi</h1><p>Chargement des catégories U10 et U11…</p></div>
    </main>
    <footer class="bottom-bar">
      <div class="bottom-left"><span class="footer-accent"></span><span id="screen-slide-label">Résultats · Classements · Prochains matchs · Phases finales</span></div>
      <div class="progress-dots" id="screen-dots" aria-label="Progression du diaporama"></div>
      <div class="footer-right"><span id="screen-countdown">10 s</span><button id="screen-pause" class="icon-button" type="button" aria-label="Mettre en pause le défilement" title="Pause / lecture (Espace)">Ⅱ</button><button id="screen-fullscreen" class="icon-button" type="button" aria-label="Plein écran" title="Plein écran (F)">⛶</button></div>
    </footer>
  </div>
</body>
</html>
