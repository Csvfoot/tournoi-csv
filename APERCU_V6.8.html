<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#21070d"><title>Tournoi CSV V6.8 — Aperçu de l'accueil spectateur</title><link rel="stylesheet" href="./styles.css?v=6.8"><style>
.demo-tag{position:fixed;top:10px;right:10px;z-index:100;background:rgba(0,0,0,.78);color:#f6d19a;border:1px solid #9e602c;border-radius:100px;padding:5px 11px;font:700 11px system-ui;box-shadow:0 6px 12px #0006}
.demo-detail{color:#e8c0a6;max-width:650px;margin:14px auto;text-align:center;font:500 13px system-ui}
.demo-scene{min-height:100dvh;background:#12070b;color:#fff7e4;padding:25px 15px;font-family:system-ui}.demo-card{max-width:630px;margin:25px auto;border:1px solid #734034;background:#241015;border-radius:19px;padding:22px}.demo-card h2{color:#ffc96f;font-size:22px}.demo-card p{line-height:1.6}.demo-back{background:#efa93b;color:#241007;font:800 14px system-ui;border:0;border-radius:12px;padding:12px 20px;min-height:48px}
</style></head>
<body style="margin:0;background:#12070b"><div class="demo-tag">APERÇU V6.8 · Données fictives</div><main id="screen" class="csv-welcome"><div class="csv-welcome-glow" aria-hidden="true"></div><section class="csv-welcome-content"><header class="csv-welcome-header"><div class="csv-welcome-logo"><img src="./apple-touch-icon.png" alt="Blason du CS La Verpillière" class="csv-welcome-blason"></div><span class="csv-welcome-eyebrow">CS LA VERPILLIÈRE</span><h1 class="csv-welcome-title">Bienvenue au <span>Tournoi CSV</span></h1><p class="csv-welcome-subtitle">Suivez les rencontres et les résultats de votre journée, simplement.</p></header><div class="csv-welcome-program"><div class="csv-welcome-date-caption">📅 JOURNÉE DU TOURNOI</div><label class="csv-welcome-date-select-wrap"><span style="position:absolute;width:1px;height:1px;overflow:hidden">Choisir une journée publiée</span><select class="csv-welcome-date-select" id="day"><option value="2027-06-05">samedi 5 juin 2027</option><option value="2027-06-12">samedi 12 juin 2027</option></select></label><div class="csv-welcome-categories" id="cats" role="group" aria-label="Catégorie du tournoi"><button type="button" class="csv-welcome-category csv-welcome-category-selected" aria-pressed="true">U10</button><button type="button" class="csv-welcome-category" aria-pressed="false">U11</button></div></div><nav class="csv-welcome-actions" aria-label="Accès rapides spectateur"><button type="button" class="csv-welcome-button csv-welcome-button-primary" data-view="program"><span class="csv-welcome-button-symbol">📅</span><span class="csv-welcome-button-copy"><strong>Voir le programme</strong><small>Horaires et terrains</small></span><span class="csv-welcome-button-arrow">›</span></button><div class="csv-welcome-secondary-grid"><button type="button" class="csv-welcome-button csv-welcome-button-secondary" data-view="team"><span class="csv-welcome-button-symbol">👟</span><span class="csv-welcome-button-copy"><strong>Mon équipe</strong><small>Tous ses matchs</small></span></button><button type="button" class="csv-welcome-button csv-welcome-button-secondary" data-view="results"><span class="csv-welcome-button-symbol">🏆</span><span class="csv-welcome-button-copy"><strong>Résultats</strong><small>Scores et classements</small></span></button></div></nav><footer class="csv-welcome-footer"><span>⚽ Bonne journée à toutes les équipes !</span></footer></section></main><script>
(function(){const days={'2027-06-05':['U10','U11'],'2027-06-12':['U13']};let selected='U10';const original=document.getElementById('screen');const home=original.outerHTML;function bind(){const day=document.getElementById('day');if(!day)return;day.addEventListener('change',()=>{selected=days[day.value][0];drawCats();});const cats=document.getElementById('cats');function drawCats(){cats.innerHTML=days[day.value].map(t=>'<button type="button" class="csv-welcome-category '+(selected===t?'csv-welcome-category-selected':'')+'" aria-pressed="'+(selected===t)+'">'+t+'</button>').join('');cats.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selected=b.textContent;drawCats();}));}drawCats();document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{const v=b.dataset.view;const title={program:'📅 Programme',team:'👟 Mon équipe',results:'🏆 Résultats'}[v];document.getElementById('screen').outerHTML='<main class="demo-scene" id="screen"><button class="demo-back" id="back">← Accueil</button><div class="demo-card"><h2>'+title+'</h2><p>Catégorie '+selected+' · Démonstration visuelle</p><p>'+(v==='team'?'Choix du club, puis calendrier de ses rencontres.':v==='results'?'Matchs terminés, scores et classements du tournoi.':'Liste des matchs avec horaires et terrains.')+'</p><p class="demo-detail">Dans la véritable application, cet accès ouvre la rubrique existante et utilise les données Firebase.</p></div></main>';document.getElementById('back').addEventListener('click',()=>{document.getElementById('screen').outerHTML=home;bind();});}));}bind()})();
</script></body></html>
