name: V7.4 - Controle visuel sans Firebase
on:
  push:
    branches:
      - develop-v7-4-ameliorations
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe du code actuel
        run: |
          node --check app.js
          node --check tests/v74-ui-smoke.cjs
          node --check tests/v74-app-smoke.cjs
          node --check sw.js
          node --check tests/v74-version-consistency.cjs
          node tests/v74-version-consistency.cjs
          node tests/v74-organizer-pwa.cjs
      - name: Installer react et Playwright dans le runner
        run: npm install --no-save --no-package-lock react@18.2.0 react-dom@18.2.0 playwright@1.55.0
      - name: Navigateur Chromium
        run: npx playwright install --with-deps chromium
      - name: Verifier les ecrans V7.4 a partir des composants reels
        run: node tests/v74-ui-smoke.cjs
      - name: Charger la page spectateur reelle depuis la branche V7.4
        run: node tests/v74-app-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-v74-pc-iphone
          path: test-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 14
